<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blank: Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
</head>
<body>
<canvas id="world" aria-label="Plaza world"></canvas>

<div class="wallpaper on" id="wallpaper" aria-hidden="true">
  <div class="wp-stars"></div>
  <div class="wp-moon"></div>
  <div class="wp-glow"></div>
  <div class="wp-name" id="wpName">Blank: Project</div>
  <div class="wp-pearls" id="wpPearls"></div>
  <svg class="wp-waves" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0 190C240 130 480 250 720 190S1200 130 1440 190V320H0Z" fill="rgba(255,255,255,.07)"/><path d="M0 245C300 195 540 295 840 245S1260 205 1440 245V320H0Z" fill="rgba(255,255,255,.09)"/></svg>
  <img class="wp-blur" id="wpBlur" alt="" hidden>
  <img class="wp-splash" id="wpSplash" alt="" hidden>
</div>

<div class="title" id="title" role="dialog" aria-label="Blank: Project title screen">
  <div class="tt-bg"><div class="wp-stars"></div><div class="tt-moon"></div><div class="tt-rays"></div></div>
  <img class="tt-img" id="ttImg" alt="" hidden>
  <div class="tt-shade"></div>
  <div class="tt-motes" id="ttMotes"></div>
  <div class="tt-logo"><span class="tt-kicker">✦ A Lantern Festival Gacha ✦</span><h1>Blank: Project</h1><span class="tt-sub">Collect · Bond · Celebrate</span></div>
  <div class="tt-center">
    <button class="tt-start" id="ttStart">Tap to start</button>
    <div class="tt-who" id="ttWho"></div>
  </div>
  <nav class="tt-side" aria-label="Title menu">
    <button class="tt-ib" id="ttNews"><span data-ic="mail"></span>Notice</button>
    <button class="tt-ib" id="ttSupport"><span data-ic="chat"></span>Support</button>
    <button class="tt-ib" data-open="settings"><span data-ic="gear"></span>Settings</button>
    <button class="tt-ib" id="ttRepair"><span data-ic="wrench"></span>Repair</button>
    <button class="tt-ib" id="ttTerms"><span data-ic="info"></span>Terms</button>
  </nav>
  <div class="tt-foot"><span>v0.9.0 · Server: Blank-1</span><span id="ttUid"></span><span>© 2026 Blank: Project</span></div>
</div>

<main class="menu is-open" id="menu" aria-label="Main menu">
  <header class="hm hm-tl">
    <button class="hm-me" data-open="profile" aria-label="Open your profile"><span style="position:relative;display:block" id="hmAvatar"></span>
      <span class="hm-id ts"><span class="hm-name" id="pname">Traveler</span><span id="hmTitle"></span></span></button>
    <div class="hm-tools">
      <button class="tool ts" data-open="wallpaper"><span class="tc glass"><span data-ic="image"></span></span>Wallpaper</button>
      <button class="tool ts" id="hideUi" aria-label="Hide the menu and show only the wallpaper"><span class="tc glass"><span data-ic="eyeOff"></span></span>Hide UI</button>
    </div>
  </header>

  <div class="hm hm-tr">
    <div class="currencies" id="wallet" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button class="rbtn glass" data-open="mail" aria-label="Mail"><span data-ic="mail"></span><span class="badge" id="mailBadge"></span></button>
    <button class="rbtn glass" data-open="settings" aria-label="Settings"><span data-ic="gear"></span></button>
    <button class="rbtn glass" data-open="admin" aria-label="Admin panel"><span data-ic="wrench"></span></button>
  </div>
  <button class="hm ticker ts" id="ticker" aria-label="World chat, enter the plaza to talk"><span data-ic="chat"></span><span id="tickerText"></span></button>

  <nav class="hm hm-left" aria-label="Banners and activities">
    <div id="promo"></div>
    <div class="ev-grid">
      <button class="ev ts" data-open="spin"><span class="evo"><span data-ic="wheel"></span></span><span class="el">Daily Spin</span><time>Free</time><span class="dot-n" id="spinDot" hidden></span></button>
      <button class="ev ts hm-ftu" id="hmOffer" data-open="offer" style="--ec:#ff8fd0" hidden><span class="evo"><span data-ic="sparkle"></span></span><span class="el" id="offerName">Offers</span><time id="offerTime"></time><span class="dot-n"></span></button>
      <button class="ev ts" data-open="events" style="--ec:#ff6f91"><span class="evo"><span data-ic="calendar"></span></span><span class="el">Events</span><span class="dot-n" id="evDot" hidden></span></button>
    </div>
  </nav>

  <nav class="hm hm-right" aria-label="Quests, pass and more">
    <button class="ev ts" data-open="quests" style="--ec:#4fd1a5"><span class="evo"><span data-ic="quests"></span></span><span class="el">Quests</span><time>Daily</time><span class="dot-n" id="qDot" hidden></span></button>
    <button class="ev ts" data-open="honor" style="--ec:#f5afe8"><span class="evo"><span data-ic="medal"></span></span><span class="el">Honor</span><time>Pass</time><span class="dot-n" id="bpDot" hidden></span></button>
    <button class="ev ts" data-open="guild" style="--ec:#e6a63c"><span class="evo"><span data-ic="guild"></span></span><span class="el">Guild</span><span class="dot-n" id="guildDot" hidden></span></button>
    <button class="ev ts hm-more" id="hmMore" style="--ec:#8f86ff" aria-expanded="false" aria-controls="hmDrop"><span class="evo"><span data-ic="grid"></span></span><span class="el">Menu</span><span class="dot-n" id="moreDot" hidden></span></button>
    <div class="hm-drop" id="hmDrop" hidden>
      <button class="ev ts" data-open="shop" style="--ec:#ff9f43"><span class="evo"><span data-ic="shop"></span></span><span class="el">Shop</span></button>
      <button class="ev ts" data-open="bag" style="--ec:#a78bfa"><span class="evo"><span data-ic="bag"></span></span><span class="el">Bag</span></button>
      <button class="ev ts" data-open="ranking" style="--ec:#ffb84a"><span class="evo"><span data-ic="trophy"></span></span><span class="el">Ranking</span></button>
      <button class="ev ts" data-open="level" style="--ec:#3fd47e"><span class="evo"><span data-ic="level"></span></span><span class="el">Level</span><span class="dot-n" id="lvDot" hidden></span></button>
      <button class="ev ts" data-open="ach"><span class="evo"><span data-ic="trophy"></span></span><span class="el">Achievements</span><span class="dot-n" id="achDot" hidden></span></button>
      <button class="ev ts" data-open="fuse" style="--ec:#ff7ccf"><span class="evo"><span data-ic="fuse"></span></span><span class="el">Fusion</span></button>
      <button class="ev ts" data-open="friends" style="--ec:#5aa9ff"><span class="evo"><span data-ic="friends"></span></span><span class="el">Friends</span><span class="dot-n" id="frDot" hidden></span></button>
      <button class="ev ts" data-open="team" style="--ec:#c58bff"><span class="evo"><span data-ic="team"></span></span><span class="el">Team</span></button>
      <button class="ev ts" data-open="redeem"><span class="evo"><span data-ic="gift"></span></span><span class="el">Redeem</span></button>
    </div>
  </nav>

  <nav class="hm hm-gates" aria-label="Modes">
    <button class="mgate g-plaza" id="enterPlaza" aria-label="Enter the plaza"><span class="mg-frame"><span class="mg-scene"><svg class="mg-svg" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="mgPs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160f3a"/><stop offset=".5" stop-color="#5a2266"/><stop offset=".82" stop-color="#d4567a"/><stop offset="1" stop-color="#ffb36a"/></linearGradient><radialGradient id="mgPg" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#ffd890" stop-opacity=".9"/><stop offset="1" stop-color="#ff8a50" stop-opacity="0"/></radialGradient></defs>
<rect width="100" height="120" fill="url(#mgPs)"/><circle cx="74" cy="20" r="9" fill="#fff4dc"/><circle cx="78" cy="17" r="8" fill="#241448"/><g fill="#fff"><circle cx="18" cy="14" r=".8"/><circle cx="34" cy="8" r=".6"/><circle cx="56" cy="16" r=".7"/><circle cx="88" cy="38" r=".6"/><circle cx="10" cy="34" r=".6"/></g>
<path d="M0 82L8 76h6l-4-4h14l-4 4h6l4 6v38H0z" fill="#2a1438"/><path d="M60 84l8-8h4l-3-4h16l-3 4h4l8 8v36H60z" fill="#2a1438"/><path d="M26 92l10-8h28l10 8v28H26z" fill="#1c0e2a"/>
<ellipse cx="50" cy="120" rx="60" ry="26" fill="url(#mgPg)"/>
<path d="M-2 44Q50 66 102 44" fill="none" stroke="#2a1438" stroke-width="1"/><g class="mg-lan"><circle cx="12" cy="48.6" r="3.2" fill="#ffcf70"/><circle cx="31" cy="54.6" r="3.4" fill="#ff8a50"/><circle cx="50" cy="56.6" r="3.6" fill="#ffcf70"/><circle cx="69" cy="54.6" r="3.4" fill="#ff8a50"/><circle cx="88" cy="48.6" r="3.2" fill="#ffcf70"/></g>
<path d="M18 60h64l-3 5H21z" fill="#7a1a2a"/><path d="M14 56q36-6 72 0l-2 4q-34-5-68 0z" fill="#a0263a"/><rect x="26" y="64" width="6" height="56" fill="#7a1a2a"/><rect x="68" y="64" width="6" height="56" fill="#7a1a2a"/><path d="M14 56q36-6 72 0" fill="none" stroke="#ffb36a" stroke-width=".8" opacity=".8"/><rect x="40" y="66" width="20" height="5" rx="1" fill="#2a1438"/></svg><i class="mg-motes"></i></span><i class="mg-shine"></i></span><span class="mg-gem"></span><span class="mg-plate ts"><b>Plaza</b></span></button>
    <button class="mgate g-raid" id="enterRaids" data-open="raids" aria-label="Open Raids"><span class="mg-frame"><span class="mg-scene"><svg class="mg-svg" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="mgRg" cx=".5" cy=".62" r=".55"><stop offset="0" stop-color="#7a3cff" stop-opacity=".9"/><stop offset=".6" stop-color="#2a1260" stop-opacity=".6"/><stop offset="1" stop-color="#0a0618" stop-opacity="0"/></radialGradient><linearGradient id="mgRs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c5272"/><stop offset="1" stop-color="#2a2436"/></linearGradient></defs>
<rect width="100" height="120" fill="#0c0818"/><rect width="100" height="120" fill="url(#mgRg)"/>
<path d="M0 0h100v8l-6 10-4-8-5 14-5-12-6 8-4-10-6 14-5-12-6 10-4-8-6 12-5-10-6 8-4-6-6 10-4-8-6 6z" fill="#1a1428"/>
<path d="M18 120V66a32 32 0 0 1 64 0v54h-12V66a20 20 0 0 0-40 0v54z" fill="url(#mgRs)"/><path d="M18 66a32 32 0 0 1 64 0" fill="none" stroke="#8a7aa8" stroke-width="1"/>
<g class="mg-runes" fill="#c9a6ff"><rect x="24" y="78" width="2" height="5"/><rect x="74" y="78" width="2" height="5"/><rect x="25" y="94" width="2" height="5"/><rect x="73" y="94" width="2" height="5"/><path d="M48 38h4l-2 4z"/><rect x="31" y="50" width="4" height="2" transform="rotate(-40 33 51)"/><rect x="65" y="50" width="4" height="2" transform="rotate(40 67 51)"/></g>
<g stroke-linecap="round"><path d="M34 22l28 26" stroke="#e8e4f4" stroke-width="2.4"/><path d="M66 22L38 48" stroke="#e8e4f4" stroke-width="2.4"/><path d="M57 37l8 2M43 37l-8 2" stroke="#d6b46a" stroke-width="2.4"/><path d="M31 19l4 4M69 19l-4 4" stroke="#5a3d24" stroke-width="3"/></g>
<path d="M0 120l6-10 8 4 6-8 10 14zM100 120l-6-12-8 6-6-6-8 12z" fill="#151020"/></svg><i class="mg-portal"></i><i class="mg-motes"></i></span><i class="mg-shine"></i></span><span class="mg-gem"></span><span class="mg-plate ts"><b>Raids</b></span></button>
    <button class="mgate g-card" id="enterClash" data-open="clash" aria-label="Card Battle: campaign and Quick match"><span class="dot-n mg-dot" id="campDot" hidden></span><span class="mg-frame"><span class="mg-scene"><svg class="mg-svg" viewBox="0 0 100 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="mgCg" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#b48cff" stop-opacity=".75"/><stop offset=".55" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#0a0820" stop-opacity="0"/></radialGradient><linearGradient id="mgCb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a8a"/><stop offset="1" stop-color="#120c34"/></linearGradient><linearGradient id="mgCe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#b8862e"/></linearGradient><linearGradient id="mgCc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9f4"/><stop offset=".5" stop-color="#c9a6ff"/><stop offset="1" stop-color="#8fb8ff"/></linearGradient></defs>
<rect width="100" height="120" fill="#0b0920"/><rect width="100" height="120" fill="url(#mgCg)"/>
<ellipse cx="50" cy="104" rx="40" ry="8" fill="#c9a6ff" opacity=".25"/>
<g class="mg-fan"><g transform="rotate(-20 50 92)"><rect x="34" y="42" width="32" height="46" rx="4" fill="url(#mgCb)" stroke="url(#mgCe)" stroke-width="1.6"/><path d="M50 56l6 9-6 9-6-9z" fill="url(#mgCc)" opacity=".8"/></g><g transform="rotate(20 50 92)"><rect x="34" y="42" width="32" height="46" rx="4" fill="url(#mgCb)" stroke="url(#mgCe)" stroke-width="1.6"/><path d="M50 56l6 9-6 9-6-9z" fill="url(#mgCc)" opacity=".8"/></g><rect x="33" y="36" width="34" height="50" rx="4" fill="url(#mgCb)" stroke="url(#mgCe)" stroke-width="1.8"/><rect x="36.5" y="39.5" width="27" height="43" rx="2.5" fill="none" stroke="#ffe9a8" stroke-width=".6" opacity=".7"/><path d="M50 46l9 15-9 15-9-15z" fill="url(#mgCc)"/><path d="M50 46v30M41 61h18" stroke="#fff" stroke-width=".7" opacity=".7"/></g>
<g class="mg-tw" fill="#fff"><path d="M20 24l1.4 4 4 1.4-4 1.4-1.4 4-1.4-4-4-1.4 4-1.4z"/><path d="M80 30l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path d="M76 92l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></g></svg><i class="mg-motes"></i></span><i class="mg-shine"></i></span><span class="mg-gem"></span><span class="mg-plate ts"><b>Card Battle</b></span></button>
  </nav>

  <nav class="hm hm-tabs" aria-label="Collection">
    <button class="tabb ts" data-open="characters"><span class="tbi"><span data-ic="chars"></span></span><span class="tbl">Characters</span><span class="dot-n" id="charDot" hidden></span></button>
    <button class="tabb ts" data-open="pets"><span class="tbi"><span data-ic="paw"></span></span><span class="tbl">Pets</span><span class="dot-n" id="petDot" hidden></span></button>
    <button class="tabb ts" data-open="farm"><span class="tbi"><span data-ic="farm"></span></span><span class="tbl">Base</span><span class="dot-n" id="farmDot" hidden></span></button>
    <button class="tabb ts" data-open="house"><span class="tbi"><span data-ic="home"></span></span><span class="tbl">House</span><span class="dot-n" id="houseDot" hidden></span></button>
    <button class="tabb ts" data-open="collection"><span class="tbi"><span data-ic="book"></span></span><span class="tbl">Collection</span></button>
    <button class="tabb ts" data-open="deck"><span class="tbi"><span data-ic="cards"></span></span><span class="tbl">Deck</span></button>
  </nav>

  <div class="hm hm-br">
    <button class="summon2" data-open="summon" data-banner="limited"><span class="so"><span data-ic="sparkle"></span></span><span class="st"><b>Summon</b></span><span class="dot-n" id="sumDot" hidden></span></button>
    <span class="lim-time" id="limTime"></span>
  </div>

  <button class="unhide glass" id="unhide" aria-label="Show the menu again"><span data-ic="eye"></span></button>
  <button class="wp-arrow prev" id="wpPrev" aria-label="Previous wallpaper" tabindex="-1"><span data-ic="back"></span></button>
  <button class="wp-arrow next" id="wpNext" aria-label="Next wallpaper" tabindex="-1"><span data-ic="back"></span></button>
</main>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="hud-left">
      <div class="row" style="gap:8px">
        <div class="pill glass"><span class="dot"></span><b id="zoneName">Pearl Fountain</b><span class="muted" id="onlineCount"></span></div>
        <button class="hbtn glass" id="peopleBtn" aria-label="People in the plaza"><span data-ic="friends"></span><span>People</span></button>
      </div>
      <div class="people glass-deep" id="people" hidden></div>
    </div>
    <div class="hud-right">
      <div class="hud-actions">
        <button class="hbtn glass" id="mapBtn"><span data-ic="map"></span><span>Map</span></button>
        <button class="hbtn glass gold" data-open="summon"><span data-ic="sparkle"></span><span>Summon</span></button>
        <button class="hbtn glass" id="openMenu"><span data-ic="grid"></span><span>Menu</span></button>
      </div>
      <button class="minimap glass" id="minimapBtn" aria-label="Open the map"><canvas id="minimap"></canvas><span id="miniLabel">Pearl Fountain</span></button>
    </div>
  </div>
  <div class="zone-title" id="zoneTitle" aria-live="polite"><span class="eyebrow">Blank: Project</span><b></b><small></small></div>
  <div class="hint glass" id="hint">WASD or arrow keys to walk · tap the ground to move · M for map · Esc for menu</div>
  <div class="hud-bottom">
    <div class="chatlog glass" id="chatlog" aria-live="polite"></div>
    <div class="chatwrap">
      <div class="emotes glass" id="emotes" hidden></div>
      <form class="chatbar glass" id="chatForm" autocomplete="off">
        <button type="button" class="iconbtn" id="emoteToggle" aria-label="Emotes"><span data-ic="smile"></span></button>
        <input id="chatInput" maxlength="80" placeholder="Say something… (Enter)" aria-label="Chat message">
        <button type="submit" class="iconbtn send" aria-label="Send"><span data-ic="send"></span></button>
      </form>
    </div>
    <div></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
