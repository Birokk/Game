  .sx-tab{width:auto;flex:1;height:70px}
  .sx-tab b{font-size:17px}
  .sx-cur{top:calc(140px + var(--st));left:var(--sl);right:auto}
  .sx-cur .cur{min-width:0}
  .sx-line{left:-10%;right:-10%;top:30%;bottom:150px}
  .sx-title{z-index:2}
  .sx-title{top:calc(190px + var(--st));max-width:none;left:var(--sl)}
  .sx-title h2{font-size:34px}
  .sx-title p{font-size:16px}
  .sx-rule{bottom:calc(150px + var(--sb))}
  .sx-bl{bottom:calc(76px + var(--sb));gap:10px}
  .sx-rb .c{width:46px;height:46px}
  .sx-rb{font-size:13px}
  .sx-skip{left:auto;right:var(--sr);transform:none;bottom:calc(92px + var(--sb));font-size:16px}
  .sx-br{left:var(--sl);bottom:calc(14px + var(--sb));gap:10px}
  .sx-pull{min-width:0;flex:1;height:54px;font-size:18px;padding:0 10px;gap:6px}
  .sx-pull .cost{font-size:15px}
  .sx-note{display:none}
}

/* minimalist round menu icons, stamina pill, daily login, summon hero art */
.ev .evo{background:rgba(8,12,30,.4);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ev:hover .evo{background:rgba(255,255,255,.16);border-color:#fff;transform:translateY(-2px)}
.ev .evo .ic{width:25px;height:25px;filter:none}
.ev .el{margin-top:5px}
#stamPill{cursor:pointer;min-width:126px}
#stamPill .cic{width:22px;height:22px}
.login-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.login-day{position:relative;display:grid;justify-items:center;gap:4px;padding:12px 4px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft)}
.login-day .cic{width:30px;height:30px}
.login-day b{font-size:14px}
.login-day.now{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent),0 0 18px rgba(255,211,107,.35)}
.login-day.done{opacity:.55}
.login-day .chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center}
.login-day .chk .ic{width:12px;height:12px}
@media (max-width:520px){.login-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sx-hero{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%;animation:rvZoom .7s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 40px rgba(0,0,0,.35))}
.sx .cs-blur{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(130%) brightness(.55)}
.sx-feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.sx-feat button{width:48px;height:48px;border-radius:50%;overflow:hidden;padding:2px;background:var(--ur);opacity:.7;transition:opacity .2s,transform .2s}
.sx-feat button.on,.sx-feat button:hover{opacity:1;transform:scale(1.06)}
.sx-feat button.on{box-shadow:0 0 0 2px #ffd84a}
.sx-feat img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 14%;background:var(--ink-2)}
.sx-feat img.chibi{object-position:50% 50%;transform:scale(1.6);transform-origin:50% 56%}
/* ---------- profile: avatar frames, titles, namecards, showcase ---------- */
.avf{position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center}
.avf .avi{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 40% 30%,#3d4378,#141a38)}
.avf .avi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.avf .avi img.chibi{object-position:50% 50%;transform:scale(1.6);transform-origin:50% 56%}
.avf::before,.avf::after{content:"";position:absolute;pointer-events:none}
/* 1 · Silver Ring: clean and simple */
.avf.f-simple .avi{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(10,15,31,.45)}
/* 2 · Gilded Crest: thick gold band with a gem on top */
.avf.f-gold::before{inset:calc(var(--s) * -.07);border-radius:50%;background:conic-gradient(from 200deg,#fff3c2,#e8b04a,#9a6a14,#ffe08a,#c98f2a,#fff6d0,#b07a1c,#fff3c2);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--s) * .09),#000 calc(100% - var(--s) * .085));mask:radial-gradient(farthest-side,transparent calc(100% - var(--s) * .09),#000 calc(100% - var(--s) * .085));
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.avf.f-gold::after{top:calc(var(--s) * -.13);left:50%;width:calc(var(--s) * .16);height:calc(var(--s) * .16);transform:translateX(-50%) rotate(45deg);border-radius:2px;
  background:radial-gradient(circle at 35% 35%,#ffd0dc,#ff3d6a 55%,#8a0f2a);border:2px solid #f2c45a;box-shadow:0 0 8px rgba(255,61,106,.7)}
/* 3 · Prism Halo (premium): spinning rainbow ring, outer glow and a twinkling star */
.avf.f-prism::before{inset:calc(var(--s) * -.08);border-radius:50%;background:conic-gradient(#a855f7,#ff6ec7,#ffd36b,#3ee6d0,#5a8cff,#a855f7);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--s) * .08),#000 calc(100% - var(--s) * .075));mask:radial-gradient(farthest-side,transparent calc(100% - var(--s) * .08),#000 calc(100% - var(--s) * .075));
  filter:drop-shadow(0 0 calc(var(--s) * .08) rgba(255,110,199,.9)) drop-shadow(0 0 calc(var(--s) * .14) rgba(62,230,208,.6));animation:spin 4s linear infinite}
.avf.f-prism::after{content:"✦";top:calc(var(--s) * -.16);right:calc(var(--s) * -.08);font-size:calc(var(--s) * .3);line-height:1;color:#fff;text-shadow:0 0 6px #ff6ec7,0 0 12px #3ee6d0;animation:twinkle 1.8s ease-in-out infinite}
.avf.f-prism .avi{box-shadow:inset 0 0 calc(var(--s) * .12) rgba(255,110,199,.45)}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}

/* titles */
.ttl{display:inline-flex;align-items:center;justify-self:start;padding:2px 12px;border-radius:999px;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em;line-height:1.4;white-space:nowrap}
.ttl.t-plain{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#e8ecff}
.ttl.t-aqua{background:rgba(20,60,80,.55);border:1px solid rgba(126,243,212,.6);color:#b9fff0;text-shadow:0 0 8px rgba(126,243,212,.9);box-shadow:0 0 12px rgba(126,243,212,.35)}
.ttl.t-ember{background:linear-gradient(90deg,#b8222b,#ff7a3d);color:#fff4d0;text-shadow:0 1px 0 rgba(90,10,10,.6);box-shadow:0 0 14px rgba(255,110,60,.55)}
.ttl.t-violet{background:rgba(40,20,80,.6);border:1px solid #c58bff;color:#e9d6ff;text-shadow:0 0 10px #a855f7;box-shadow:0 0 16px rgba(168,85,247,.5)}
.ttl.t-gold{background:linear-gradient(180deg,#3a2a08,#1e1604);border:1px solid #e8b04a;box-shadow:0 0 16px rgba(255,211,107,.5)}
.ttl.t-gold,.ttl.t-prism{position:relative}
.ttl.t-gold>*,.ttl.t-gold{color:#ffe08a;text-shadow:0 0 10px rgba(255,211,107,.9)}
.ttl.t-prism{background:linear-gradient(90deg,#a855f7,#ff6ec7,#ffd36b,#3ee6d0,#a855f7);background-size:250% 100%;animation:shimmer 3s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(60,0,80,.6),0 0 10px rgba(255,255,255,.7);box-shadow:0 0 18px rgba(255,110,199,.6),0 0 30px rgba(62,230,208,.35)}

/* namecards */
.nc{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
.nc img{position:absolute;right:0;top:0;width:60%;height:100%;object-fit:cover;object-position:50% 15%;-webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%)}
.nc img.chibi{top:-72%;height:290%;object-position:50% 0}
.nc-char{background:linear-gradient(110deg,#141a38,#2a2f6a)}
.nc-pearl{background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.55) 0 7%,rgba(220,200,255,.25) 12%,transparent 22%),linear-gradient(180deg,#1b2768,#4d3a9e 50%,#c776b8 85%,#ffb3cf)}
.nc-pearl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:radial-gradient(ellipse at 30% 100%,rgba(255,255,255,.18),transparent 60%),radial-gradient(ellipse at 80% 110%,rgba(255,255,255,.15),transparent 55%)}
.nc-starlit{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 1px,transparent 1.6px) 0 0/60px 60px,radial-gradient(circle at 70% 60%,rgba(200,220,255,.7) 1px,transparent 1.6px) 0 0/43px 43px,radial-gradient(ellipse at 75% 40%,rgba(90,140,255,.35),transparent 60%),linear-gradient(160deg,#060a24,#121a4a 60%,#1e1450)}
.nc-lantern{background:radial-gradient(circle at 12% 30%,#ffb070 0 3%,#e8392f 3.5% 6%,transparent 9%),radial-gradient(circle at 34% 18%,#ffb070 0 2.5%,#e8392f 3% 5%,transparent 8%),radial-gradient(circle at 58% 32%,#ffb070 0 3%,#e8392f 3.5% 6%,transparent 9%),radial-gradient(circle at 84% 16%,#ffb070 0 2.5%,#e8392f 3% 5%,transparent 8%),
  radial-gradient(ellipse at 50% 120%,rgba(255,170,80,.55),transparent 60%),linear-gradient(180deg,#2a1020,#4a1a24 55%,#8a3a1a)}
.nc-maple{background:radial-gradient(ellipse at 15% 20%,#ff8a3a 0 10%,transparent 24%),radial-gradient(ellipse at 85% 30%,#e2581f 0 12%,transparent 26%),radial-gradient(ellipse at 60% 90%,#ffb055 0 8%,transparent 22%),linear-gradient(140deg,#3a1408,#8a2a10 50%,#c8461b)}
.nc-aurora{background:linear-gradient(115deg,#1a0f3a,#3a1a6e 30%,#6b3fd1 45%,#ff6ec7 60%,#ffd36b 72%,#3ee6d0 86%,#1a0f3a);background-size:300% 100%;animation:shimmer 8s linear infinite}
.nc-aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 1px,transparent 1.6px) 0 0/50px 50px,linear-gradient(transparent 40%,rgba(10,5,30,.45))}

.pf-card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;min-height:170px;padding:26px 26px;border-radius:22px;overflow:hidden;border:1px solid var(--edge)}
.pf-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,30,.55),transparent 55%);pointer-events:none}
.pf-me{position:relative;z-index:1;display:flex;align-items:center;gap:22px;min-width:0}
.pf-who{display:grid;gap:6px;min-width:0}
.pf-who b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.pf-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.pf-stats div{display:grid;justify-items:center;gap:2px;padding:8px 12px;border-radius:12px;background:rgba(8,12,30,.6);border:1px solid var(--edge-soft)}
.pf-stats b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.pf-stats span{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pf-show{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pf-slot{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:2px solid var(--rc,var(--edge));background:linear-gradient(180deg,color-mix(in srgb,var(--rc,#7f8bb3) 30%,var(--ink-2)),var(--ink-2));transition:transform .2s}
.pf-slot.r5{border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,#a855f7 32%,var(--ink-2)),var(--ink-2)) padding-box,var(--ur) border-box}
.pf-slot:hover{transform:translateY(-3px)}
.pf-slot.on{box-shadow:0 0 0 3px var(--mint)}
.pf-slot.none{border-style:dashed}
.pf-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pf-sl{position:absolute;left:0;right:0;bottom:0;display:grid;gap:2px;justify-items:start;padding:20px 10px 8px;background:linear-gradient(transparent,rgba(5,8,20,.9));text-align:left}
.pf-sl b{font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pf-sl .stars6{font-size:11px}
.pf-add{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;color:var(--muted);font-weight:900;font-size:13px}
.pf-add .ic{width:30px;height:30px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pf-grid.wide{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pf-opt{position:relative;display:grid;justify-items:center;align-content:start;gap:10px;padding:16px 8px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--edge-soft);transition:background .2s,transform .2s}
.pf-opt:hover:not(:disabled){background:var(--glass-hi);transform:translateY(-2px)}
.pf-opt.on{border-color:var(--mint);box-shadow:0 0 0 2px color-mix(in srgb,var(--mint) 40%,transparent)}
.pf-opt.locked{cursor:not-allowed}
.pf-opt.locked>*:not(.pf-lock){opacity:.4}
.pf-ol{font-size:12px;font-weight:900;text-align:center;line-height:1.2}
.pf-ol:empty{display:none}
.prem{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--ur);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;vertical-align:1px}
.pf-lock{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--gold)}
.pf-lock .ic{width:13px;height:13px}
.pf-tt{min-height:34px;display:grid;place-items:center}
.pf-nc{position:relative;display:block;width:100%;aspect-ratio:3/1;border-radius:10px;overflow:hidden}
.pf-thumb{display:block;width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--rc)}
.pf-thumb.r5{border-color:#ff6ec7}
.pf-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.pf-thumb img.chibi{object-position:50% 50%;transform:scale(1.6);transform-origin:50% 56%}
.pf-empty{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--edge);color:var(--muted)}
/* home: profile block */
.hm-me{display:flex;align-items:center;gap:12px;text-align:left;border-radius:999px;padding:2px 10px 2px 2px;transition:background .2s}
.hm-me:hover{background:rgba(255,255,255,.08)}
.hm-me .lvb{position:absolute;right:-4px;bottom:-4px;z-index:2;min-width:24px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid #141a38}
.hm-me .avf{margin:4px}
.hm-id .ttl{font-size:13px;padding:1px 10px}
@media (max-width:820px){
  .pf-card{padding:18px}
  .pf-me{gap:14px}
  .pf-who b{font-size:24px}
  .pf-stats{grid-template-columns:repeat(2,auto)}
  .pf-show{gap:8px}
  .hm-me{gap:8px}
}
@media (max-width:520px){.pf-show{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<canvas id="world" aria-label="Plaza world"></canvas>

<div class="wallpaper on" id="wallpaper" aria-hidden="true">
  <div class="wp-stars"></div>
  <div class="wp-moon"></div>
  <div class="wp-glow"></div>
  <div class="wp-name" id="wpName">Prism Plaza</div>
  <div class="wp-pearls" id="wpPearls"></div>
  <svg class="wp-waves" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0 190C240 130 480 250 720 190S1200 130 1440 190V320H0Z" fill="rgba(255,255,255,.07)"/><path d="M0 245C300 195 540 295 840 245S1260 205 1440 245V320H0Z" fill="rgba(255,255,255,.09)"/></svg>
  <img class="wp-blur" id="wpBlur" alt="" hidden>
  <img class="wp-splash" id="wpSplash" alt="" hidden>
</div>

<main class="menu is-open" id="menu" aria-label="Main menu">
  <header class="hm hm-tl">
    <button class="hm-me" data-open="profile" aria-label="Open your profile"><span style="position:relative;display:block" id="hmAvatar"></span>
      <span class="hm-id ts"><span class="hm-name" id="pname">Traveler</span><span id="hmTitle"></span></span></button>
    <div class="hm-tools">
      <button class="tool ts" data-open="wallpaper"><span class="tc glass"><span data-ic="image"></span></span>Wallpaper</button>
      <button class="tool ts" id="hideUi" aria-label="Hide the menu and show only the wallpaper"><span class="tc glass"><span data-ic="eyeOff"></span></span>Hide UI</button>
    </div>
  </header>

  <div class="hm hm-tr">
    <div class="currencies" id="wallet" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button class="rbtn glass" data-open="mail" aria-label="Mail"><span data-ic="mail"></span><span class="badge" id="mailBadge"></span></button>
    <button class="rbtn glass" data-open="settings" aria-label="Settings"><span data-ic="gear"></span></button>
    <button class="rbtn glass" data-open="admin" aria-label="Admin panel"><span data-ic="wrench"></span></button>
  </div>
  <button class="hm ticker ts" id="ticker" aria-label="World chat, enter the plaza to talk"><span data-ic="chat"></span><span id="tickerText"></span></button>

  <nav class="hm hm-left" aria-label="Banners and activities">
    <div id="promo"></div>
    <div class="ev-grid">
      <button class="ev ts" data-open="login"><span class="evo"><span data-ic="gift"></span></span><span class="el">Daily Login</span><time>+1 pull</time><span class="dot-n" id="loginDot" hidden></span></button>
      <button class="ev ts" data-open="events" style="--ec:#ff6f91"><span class="evo"><span data-ic="calendar"></span></span><span class="el">Events</span><time>Oct 31</time></button>
      <button class="ev ts" data-open="ranking" style="--ec:#ffb84a"><span class="evo"><span data-ic="trophy"></span></span><span class="el">Ranking</span></button>
      <button class="ev ts" data-open="friends" style="--ec:#5aa9ff"><span class="evo"><span data-ic="friends"></span></span><span class="el">Friends</span></button>
    </div>
  </nav>

  <nav class="hm hm-right" aria-label="Shop and items">
    <button class="ev ts" data-open="shop" style="--ec:#ff9f43"><span class="evo"><span data-ic="shop"></span></span><span class="el">Shop</span></button>
    <button class="ev ts" data-open="quests" style="--ec:#4fd1a5"><span class="evo"><span data-ic="quests"></span></span><span class="el">Quests</span><time>Daily</time></button>
    <button class="ev ts" data-open="bag" style="--ec:#a78bfa"><span class="evo"><span data-ic="bag"></span></span><span class="el">Bag</span></button>
    <button class="ev ts" data-open="team" style="--ec:#c58bff"><span class="evo"><span data-ic="team"></span></span><span class="el">Team</span></button>
  </nav>

  <button class="hm portal" id="enterPlaza" aria-label="Enter the plaza"><span class="swirl"></span><span class="rim"></span><span class="plbl ts">Enter<br>Plaza</span></button>

  <nav class="hm hm-tabs" aria-label="Collection">
    <button class="tabb ts" data-open="characters">Characters<span class="dot-n" id="charDot" hidden></span></button>
    <button class="tabb ts" data-open="skins">Skins</button>
    <button class="tabb ts" data-open="pets">Pets</button>
    <button class="tabb ts" data-open="collectibles">Collectibles</button>
    <button class="tabb ts" data-open="collection">Collection</button>
  </nav>

  <div class="hm hm-br">
    <button class="pitycard" id="pityCard" data-open="summon" data-banner="limited"></button>
    <button class="summon2" data-open="summon" data-banner="limited"><span class="so"><span data-ic="sparkle"></span></span><span class="st"><b>Summon</b><small id="summonCost"></small></span><span class="dot-n" id="sumDot" hidden></span></button>
    <span class="lim-time" id="limTime"></span>
  </div>

  <button class="unhide glass" id="unhide" aria-label="Show the menu again"><span data-ic="eye"></span></button>
</main>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="hud-left">
      <div class="row" style="gap:8px">
        <div class="pill glass"><span class="dot"></span><b id="zoneName">Pearl Fountain</b><span class="muted" id="onlineCount"></span></div>
        <button class="hbtn glass" id="peopleBtn" aria-label="People in the plaza"><span data-ic="friends"></span><span>People</span></button>
      </div>
      <div class="people glass-deep" id="people" hidden></div>
    </div>
    <div class="hud-right">
      <div class="hud-actions">
        <button class="hbtn glass" id="mapBtn"><span data-ic="map"></span><span>Map</span></button>
        <button class="hbtn glass gold" data-open="summon"><span data-ic="sparkle"></span><span>Summon</span></button>
        <button class="hbtn glass" id="openMenu"><span data-ic="grid"></span><span>Menu</span></button>
      </div>
      <button class="minimap glass" id="minimapBtn" aria-label="Open the map"><canvas id="minimap"></canvas><span id="miniLabel">Pearl Fountain</span></button>
    </div>
  </div>
  <div class="zone-title" id="zoneTitle" aria-live="polite"><span class="eyebrow">Prism Plaza</span><b></b><small></small></div>
  <div class="hint glass" id="hint">WASD or arrow keys to walk · tap the ground to move · M for map · Esc for menu</div>
  <div class="hud-bottom">

  set(k, v) { return this.run('readwrite', s => s.put(v, k)); },

function resizeImage(file, max, type = 'image/webp') {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('That file is not an image. Pick a PNG, JPG, WebP or SVG.'));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth || max, h = img.naturalHeight || max, k = Math.min(1, max / Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let url = c.toDataURL(type, 0.9);
        if (!url.startsWith('data:' + type)) url = c.toDataURL('image/png');
        res(url);
      };
      img.onerror = () => rej(new Error('Could not read that image. Try another file.'));
      img.src = reader.result;
    };
    reader.onerror = () => rej(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
}

function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.closePath(); c.fill(); }
function hexA(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function rgbOf(col) {
  if (col.startsWith('rgb')) return col.match(/[\d.]+/g).slice(0, 3).map(Number);
  const h = col.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);

const portraitCache = new Map(), splashCache = new Map();
function portrait(look, rarity) {
  const key = JSON.stringify(look) + '|' + rarity;

  const c = document.createElement('canvas'); c.width = 270; c.height = 480;
  const g = c.getContext('2d');

/* stamina: 240 max, +1 every 6 minutes (nothing spends it yet) */
const STAMINA_MAX = 240, STAMINA_MS = 6 * 60 * 1000;
function stamina() {
  const st = S.stamina, now = Date.now();
  if (st.v >= STAMINA_MAX) { st.t = now; return st.v; }
  const k = Math.floor((now - st.t) / STAMINA_MS);
  if (k > 0) { st.v = Math.min(STAMINA_MAX, st.v + k); st.t = st.v >= STAMINA_MAX ? now : st.t + k * STAMINA_MS; persist(); }
  return st.v;
}
function spendStamina(n) { if (stamina() < n) return false; if (S.stamina.v >= STAMINA_MAX) S.stamina.t = Date.now(); S.stamina.v -= n; persist(); renderStamina(); return true; }
function renderStamina() {
  const el = $('#stamVal'); if (!el) return;
  const v = stamina(), left = STAMINA_MS - (Date.now() - S.stamina.t), m = Math.floor(left / 6e4), sec = Math.floor(left % 6e4 / 1e3);
  el.innerHTML = `${v}<span style="color:var(--muted);font-weight:800">/${STAMINA_MAX}</span>`;
  $('#stamPill').title = v >= STAMINA_MAX ? 'Stamina is full' : `Stamina · +1 in ${m}:${String(sec).padStart(2, '0')}`;
}

  root.querySelectorAll('[data-show]').forEach(b => b.onclick = () => {

/* =========================================================
   WORLD — 2.5D isometric plaza: a lantern-festival town at night
   Two ground levels: the tea terrace is one level up and is reached by stairs.
   ========================================================= */
const canvas = $('#world'), ctx = canvas.getContext('2d');
const N = 28, TW = 64, TH = 32, LV = 20;   // LV: screen px per terrace level
const T = { STONE: 0, SLAB: 1, LANE: 2, GRASS: 3, WATER: 4, TERRACE: 5 };
const tiles = new Uint8Array(N * N), blocked = new Uint8Array(N * N), hgt = new Uint8Array(N * N), stairs = new Uint8Array(N * N);
const idx = (x, y) => y * N + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
const isoZ = (x, y, v) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 - v });
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(7);
const objects = [], groundDeco = [], carpets = [], lights = [], strings = [];

/* height in levels at a point; stairs (1: down toward +x, 2: down toward +y) ramp between the levels */
function heightAt(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (!inMap(tx, ty)) return 0;
  const s = stairs[idx(tx, ty)];
  if (s === 1) return clamp(1 - (x - tx), 0, 1);
  if (s === 2) return clamp(1 - (y - ty), 0, 1);
  return hgt[idx(tx, ty)];
}
function block(x, y) { if (inMap(x, y)) blocked[idx(x, y)] = 1; }
function put(kind, x, y, o = {}) {
  const ob = { kind, x: x + .5, y: y + .5, z: hgt[idx(x, y)], depth: x + y + 1, ...o };
  if (!o.walk) block(x, y);
  objects.push(ob); return ob;
}
/* multi-tile props are sorted against characters by their front corners */
function putBig(kind, x, y, w, d, o = {}) {
  for (let j = y; j < y + d; j++) for (let i = x; i < x + w; i++) block(i, j);
  const ob = { kind, x, y, w, d, z: hgt[idx(x, y)], depth: Math.min(x + y + d, x + w + y) - .5, ...o };
  objects.push(ob); return ob;
}
function addBuilding(x, y, w, d, h, o = {}) {
  const b = putBig('building', x, y, w, d, { h, ...o });
  for (let i = 0; i < w; i++) lights.push({ x: x + i + .5, y: y + d + .5, z: b.z, r: 54, a: .2 });
  for (let j = 0; j < d; j++) lights.push({ x: x + w + .5, y: y + j + .5, z: b.z, r: 54, a: .16 });
}
function addLamp(x, y) { put('lamp', x, y); lights.push({ x: x + .7, y: y + .3, z: hgt[idx(x, y)], r: 110, a: .3 }); }
function addRail(x, y, side) { objects.push({ kind: 'rail', x, y, side, z: hgt[idx(x, y)], depth: x + y + 1.5 }); }
function addString(ax, ay, ah, bx, by, bh, n) {
  strings.push({ ax, ay, ah, bx, by, bh, n });
  for (let i = 1; i <= n; i++) { const f = i / (n + 1), x = ax + (bx - ax) * f, y = ay + (by - ay) * f; lights.push({ x, y, z: heightAt(x, y), r: 44, a: .1 }); }
}
function addMaple(x, y) {
  if (!inMap(x, y) || blocked[idx(x, y)] || stairs[idx(x, y)]) return false;
  if (objects.some(o => o.kind === 'maple' && Math.hypot(o.x - x - .5, o.y - y - .5) < 2.2)) return false;
  put('maple', x, y, { v: rnd() }); return true;
}

function buildMap() {
  // tea terrace in the back-left corner, one level up, stairs on its east and south sides
  for (let y = 0; y < 10; y++) for (let x = 0; x < 10; x++) { hgt[idx(x, y)] = 1; tiles[idx(x, y)] = T.TERRACE; }
  stairs[idx(10, 5)] = stairs[idx(10, 6)] = 1;
  stairs[idx(5, 10)] = stairs[idx(6, 10)] = 2;
  // paving: big slabs on the square, cobbled lanes, a grassy maple garden with a pond
  for (let y = 10; y <= 18; y++) for (let x = 10; x <= 18; x++) tiles[idx(x, y)] = T.SLAB;
  for (let i = 19; i < N - 1; i++) for (let k = 13; k <= 15; k++) { tiles[idx(i, k)] = T.LANE; tiles[idx(k, i)] = T.LANE; }
  for (let y = 11; y < N - 1; y++) for (let x = 1; x <= 9; x++) tiles[idx(x, y)] = T.GRASS;
  for (let x = 1; x <= 9; x++) tiles[idx(x, 13)] = tiles[idx(x, 14)] = T.LANE;
  for (let y = 19; y <= 22; y++) for (let x = 4; x <= 7; x++) { tiles[idx(x, y)] = T.WATER; block(x, y); }
  // town wall behind, low balustrade in front
  for (let i = 0; i < N; i++) {
    put('wall', i, 0); if (i) put('wall', 0, i, { win: i % 3 === 1 });
    if (i) { put('lowwall', i, N - 1, { lamp: i % 4 === 2 }); if (i < N - 1) put('lowwall', N - 1, i, { lamp: i % 4 === 2 }); }
  }
  // houses
  addBuilding(1, 1, 6, 2, 50, { roof: '#3b3850', door: 3 });          // tea house, up on the terrace
  addBuilding(11, 1, 5, 2, 58, { roof: '#3a3a52', wall: '#ead6b0' });
  addBuilding(16, 1, 4, 2, 72, { roof: '#45394f', wall: '#e2c9a4', door: 2 });
  addBuilding(20, 1, 7, 2, 54, { roof: '#363a50', wall: '#ecdcbc', door: 3 });
  addBuilding(1, 16, 2, 6, 52, { roof: '#3d3650', wall: '#e8d2ae' });
  // terrace: railings, red carpet, game table, flowers, lamps
  for (let k = 1; k < 10; k++) if (k !== 5 && k !== 6) { addRail(9, k, 'R'); addRail(k, 9, 'L'); }
  carpets.push({ x0: 2.3, y0: 4.3, x1: 8.7, y1: 8.7, z: 1 });
  put('table', 5, 6);
  addLamp(9, 3); addLamp(3, 9);
  put('pot', 1, 4); put('pot', 1, 8); put('boxes', 7, 1); addMaple(8, 1);
  // lantern square
  putBig('crate', 13, 13, 2, 2);
  lights.push({ x: 14, y: 14, z: 0, r: 170, a: .3 });
  [[11, 11], [17, 11], [11, 17], [17, 17]].forEach(([x, y]) => addLamp(x, y));
  addString(11.5, 11.5, 66, 17.5, 11.5, 66, 6); addString(11.5, 17.5, 66, 17.5, 17.5, 66, 6);
  addString(11.5, 11.5, 66, 11.5, 17.5, 66, 6); addString(17.5, 11.5, 66, 17.5, 17.5, 66, 6);
  [[10, 10], [18, 10], [10, 18], [18, 18]].forEach(([x, y]) => put('pot', x, y));
  put('crackers', 12, 15); put('crackers', 16, 12);
  carpets.push({ x0: 13.15, y0: 15.15, x1: 14.85, y1: N - 1 });
  // night market
  const GOODS = ['#ffd36b', '#ff6f91', '#7ef3d4', '#c58bff', '#ff9f43', '#9be7ff', '#ffffff'];
  [12, 16, 20, 24].forEach(x => {
    putBig('stall', x, 5, 2, 1, { goods: Array.from({ length: 7 }, (_, k) => ({ u: (k % 4 + .5) / 4, v: k < 4 ? .3 : .7, c: GOODS[Math.floor(rnd() * GOODS.length)], k: Math.floor(rnd() * 3) })) });
    lights.push({ x: x + 1, y: 6.4, z: 0, r: 64, a: .22 });
  });
  addLamp(14, 8); addLamp(22, 8);

      b.path = t ? findPath(b.x, b.y, t.x, t.y) : null; b.stuck = 0;
      if (!b.path || !b.path.length) { b.path = null; b.idle = 1; }
    } else if (!followPath(b, dt * .8)) { b.idle = 1 + Math.random() * 4; if (Math.random() < .5) b.dir = 'down'; b.ex = 0; }
    b.nextTalk -= dt;
    if (b.nextTalk <= 0) { b.nextTalk = 8 + Math.random() * 16; if (Math.random() < .6) say(b, pick(BOT_LINES)); else emote(b, pick(EMOTES)); }
  });
  entities.forEach(e => { e.z = heightAt(e.x, e.y) * LV; });
  updateFireworks(dt); updateLeaves(dt);
  const p = isoZ(player.x, player.y, player.z), k = 1 - Math.pow(.002, dt);
  cam.x += (p.x - cam.x) * k; cam.y += (p.y - 20 - cam.y) * k;
}

/* fireworks: rockets from the crate, the stage and behind the rooftops; a spark fountain on the crate */
const rockets = [], sparks = [], flashes = [];
const FW_PAL = [['#ffd36b', '#fff1b0', '#ffb347'], ['#ff8a5c', '#ffd36b', '#fff1b0'], ['#ff6ec7', '#ffd6f0', '#c58bff'], ['#5ff2dd', '#fff1b0', '#ffd36b'], ['#ffd36b', '#ff6f6f', '#fff1b0']];
let fwTimer = 1;
function burst(r) {
  const n = 90 + Math.floor(Math.random() * 40), sp = 140 + Math.random() * 70;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + Math.random() * .08, v = sp * (.78 + Math.random() * .3);
    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.1 + Math.random() * .6, max: 1.7, col: rpick(r.pal), s: 2.3 });
  }
  for (let k = 0; k < n / 3; k++) {
    const a = Math.random() * Math.PI * 2, v = sp * .4 * Math.random();
    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .7 + Math.random() * .4, max: 1.1, col: '#fff6d8', s: 1.3 });
  }
  flashes.push({ x: r.x, y: r.y, life: .45, max: .45 });
  if (sparks.length > 1600) sparks.splice(0, sparks.length - 1600);
}
function updateFireworks(dt) {
  fwTimer -= dt;
  if (fwTimer <= 0) {
    fwTimer = .7 + Math.random() * 1.6;
    // from the crate, the stage drum, or somewhere around the player so bursts stay in view
    const roll = Math.random(), src = roll < .2 ? [14, 14, 36] : roll < .35 ? [24, 24, 40] : [clamp(player.x + (Math.random() - .5) * 14, 1, N - 2), clamp(player.y + (Math.random() - .5) * 14, 1, N - 2), 60];
    const p = iso(src[0], src[1]);
    rockets.push({ x: p.x, y: p.y - src[2], top: p.y - src[2] - (130 + Math.random() * 130), vy: -340, dx: (Math.random() - .5) * 30, pal: rpick(FW_PAL) });
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.y += r.vy * dt; r.x += r.dx * dt;
    if (Math.random() < .7) sparks.push({ x: r.x, y: r.y, vx: (Math.random() - .5) * 20, vy: 30, life: .35, max: .35, col: '#ffd9a0', s: 1.2 });
    if (r.y <= r.top) { burst(r); rockets.splice(i, 1); }
  }
  const cp = iso(14, 14);
  for (let k = Math.random() < 50 * dt % 1 ? 1 : 0, n = Math.floor(50 * dt) + k; n > 0; n--)
    sparks.push({ x: cp.x + (Math.random() - .5) * 24, y: cp.y - 40, vx: (Math.random() - .5) * 60, vy: -(80 + Math.random() * 110), life: .8, max: .8, col: rpick(['#ffd36b', '#fff1b0', '#ffb347']), s: 1.3 });
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life -= dt;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    p.vx *= .985; p.vy = p.vy * .985 + 55 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
}
function drawFireworks(c) {
  flashes.forEach(f => glow(c, f.x, f.y, 110, f.life / f.max * .7));
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  sparks.forEach(p => {
    let a = Math.min(1, p.life / p.max * 1.6); if (p.life < .35 && Math.random() < .4) a *= .3;
    c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = p.s;
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .06, p.y - p.vy * .06); c.stroke();
    if (p.s > 2) { c.fillStyle = '#fff8e0'; ell(c, p.x, p.y, 1.1, 1.1); }
  });
  c.globalAlpha = 1; c.fillStyle = '#fff3c8'; rockets.forEach(r => ell(c, r.x, r.y, 1.8, 1.8));
  c.globalCompositeOperation = 'source-over';
}

/* drifting maple leaves and confetti (screen space) */
const newLeaf = anyY => ({ x: Math.random(), y: anyY ? Math.random() : -.05, vx: (Math.random() - .3) * .02, vy: .025 + Math.random() * .035, r: Math.random() * 6, vr: (Math.random() - .5) * 3, s: 2.5 + Math.random() * 3, c: rpick(['#ff7a3d', '#ffb347', '#e8442f', '#ffd36b', '#ff6f91']), conf: Math.random() < .45, ph: Math.random() * 6 });
const leaves = Array.from({ length: 28 }, () => newLeaf(true));
function updateLeaves(dt) {
  leaves.forEach((l, i) => {
    l.y += l.vy * dt; l.x += (l.vx + Math.sin(now + l.ph) * .01) * dt; l.r += l.vr * dt;
    if (l.y > 1.05 || l.x < -.05 || l.x > 1.05) leaves[i] = newLeaf(false);
  });
}
function drawLeaves(c) {
  c.globalAlpha = .8;
  leaves.forEach(l => {
    c.save(); c.translate(l.x * W, l.y * H); c.rotate(l.r); c.scale(1, Math.cos(now * 3 + l.ph)); c.fillStyle = l.c;
    if (l.conf) c.fillRect(-l.s / 2, -l.s / 4, l.s, l.s / 2); else { c.beginPath(); c.ellipse(0, 0, l.s, l.s * .55, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
  });
  c.globalAlpha = 1;
}

/* lantern strings hang above everyone, so they draw after the sorted pass */
function drawStrings(c) {
  strings.forEach((s, si) => {
    const a = isoZ(s.ax, s.ay, heightAt(s.ax, s.ay) * LV + s.ah), b = isoZ(s.bx, s.by, heightAt(s.bx, s.by) * LV + s.bh);
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + 22 + Math.hypot(b.x - a.x, b.y - a.y) * .08 };
    c.strokeStyle = 'rgba(40,20,20,.85)'; c.lineWidth = 1; c.beginPath(); c.moveTo(a.x, a.y); c.quadraticCurveTo(m.x, m.y, b.x, b.y); c.stroke();
    for (let i = 1; i <= s.n; i++) {
      const f = i / (s.n + 1), u = 1 - f, qx = u * u * a.x + 2 * u * f * m.x + f * f * b.x, qy = u * u * a.y + 2 * u * f * m.y + f * f * b.y;
      const sway = Math.sin(now * 1.6 + i + si) * 1.2;
      c.beginPath(); c.moveTo(qx, qy); c.lineTo(qx + sway, qy + 5); c.stroke();
      drawLantern(c, qx + sway, qy + 10, 4.6, now + i);
    }
  });
}

/* render */
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * .7, r: Math.random() * 1.3 + .3, p: Math.random() * 6 }));
function drawBubble(c, x, y, text) {
  c.font = '800 11px Nunito, system-ui, sans-serif';
  const words = text.split(' '), lines = [];
  let cur = '';
  words.forEach(w => { const test = cur ? cur + ' ' + w : w; if (c.measureText(test).width > 140 && cur) { lines.push(cur); cur = w; } else cur = test; });
  if (cur) lines.push(cur);
  if (lines.length > 2) { lines.length = 2; lines[1] = lines[1].slice(0, 18) + '…'; }
  const w = Math.max(...lines.map(l => c.measureText(l).width)) + 16, h = lines.length * 14 + 8;
  c.fillStyle = 'rgba(255,255,255,.96)'; rr(c, x - w / 2, y - h, w, h, 8); c.fill();
  poly(c, [{ x: x - 5, y: y - 1 }, { x: x + 5, y: y - 1 }, { x, y: y + 5 }]);
  c.fillStyle = '#1b2240'; c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach((l, i) => c.fillText(l, x, y - h + 11 + i * 14));
}
function render() {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = c.createRadialGradient(W / 2, H * .45, 40, W / 2, H * .5, Math.max(W, H) * .85);
  bg.addColorStop(0, '#3a2440'); bg.addColorStop(.5, '#1d1328'); bg.addColorStop(1, '#0b0712');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  stars.forEach(s => { c.fillStyle = `rgba(255,236,220,${.25 + Math.sin(now * 1.5 + s.p) * .2})`; ell(c, s.x * W, s.y * H, s.r, s.r); });

  c.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * (W / 2 - cam.x * zoom), dpr * (H / 2 - cam.y * zoom));
  c.drawImage(ground, -OX, -OY, ground.width / GS, ground.height / GS);
  if (marker && now - marker.t < .8) {
    const p = isoZ(marker.x, marker.y, heightAt(marker.x, marker.y) * LV), f = (now - marker.t) / .8;
    c.strokeStyle = `rgba(126,243,212,${1 - f})`; c.lineWidth = 2;
    c.beginPath(); c.ellipse(p.x, p.y, 6 + f * 10, 3 + f * 5, 0, 0, Math.PI * 2); c.stroke();
  }
  const list = objects.slice();
  entities.forEach(e => list.push({ kind: 'ent', e, depth: e.x + e.y }));
  list.sort((a, b) => a.depth - b.depth);
  list.forEach(o => {
    if (o.kind === 'ent') {
      const e = o.e, p = isoZ(e.x, e.y, e.z);
      if (e === player) { c.strokeStyle = '#7ef3d4'; c.lineWidth = 2; c.beginPath(); c.ellipse(p.x, p.y, 13, 5.5, 0, 0, Math.PI * 2); c.stroke(); }
      const al = e === player ? teleAlpha() : 1;
      if (al < 1) { c.save(); c.globalAlpha = al; }
      drawChibi(c, p.x, p.y, e.look, { s: CHIBI_S * (al < 1 ? .55 + .45 * al : 1), moving: e.moving, phase: e.phase, dir: e.dir, ex: e.ex, t: now + e.x });
      if (al < 1) c.restore();
    } else if (o.z) { c.save(); c.translate(0, -o.z * LV); PAINT[o.kind](c, o, now); c.restore(); }
    else PAINT[o.kind](c, o, now);
  });
  drawTeleFx(c);
  drawStrings(c);
  drawFireworks(c);
  // overlay pass: names, bubbles, emotes
  entities.forEach(e => {
    const p = isoZ(e.x, e.y, e.z);
    if (S.settings.names) {
      c.font = '800 9px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
      c.lineWidth = 3; c.strokeStyle = 'rgba(10,15,31,.6)'; c.strokeText(e.name, p.x, p.y + 5);
      c.fillStyle = e === player ? '#7ef3d4' : '#ffffff'; c.fillText(e.name, p.x, p.y + 5);
    }
    const top = p.y - (e.look.style === 2 ? 62 : e.look.style === 4 ? 60 : 55) * CHIBI_S;
    if (e.bubble && e.bubble.until > now) drawBubble(c, p.x, top, e.bubble.text);
    else if (e.emote && e.emote.until > now) {
      const by = top - Math.sin(Math.min(1, (e.emote.until - now) * 2) * Math.PI / 2) * 2;
      c.fillStyle = 'rgba(255,255,255,.96)'; rr(c, p.x - 13, by - 26, 26, 24, 8); c.fill();
      poly(c, [{ x: p.x - 4, y: by - 3 }, { x: p.x + 4, y: by - 3 }, { x: p.x, y: by + 3 }]);
      c.font = '15px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(e.emote.e, p.x, by - 13.5);
    }
  });
  // screen space: leaves and confetti, then a warm vignette
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawLeaves(c);
  const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(10,5,15,0)'); vg.addColorStop(1, 'rgba(10,5,15,.5)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
}

let last = performance.now(), frameN = 0;
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t; now = t / 1000;
  update(dt);
  frameN++;
  // the wallpaper covers the world while the menu is open, so skip drawing it then
  if (!menuOpen && !modalEl && !pullEl) { render(); if (frameN % 3 === 0) drawMinimap(); }
  requestAnimationFrame(loop);
}


/* boot */
(async function boot() {
  try { (await DB.all()).forEach(([k, v]) => MEDIA.set(k, v)); }
  catch (e) { console.warn('Image storage unavailable', e); }
  // move art saved by the first version (inside localStorage) into IndexedDB
  for (const e of S.pool) if (e.art && e.art.startsWith('data:')) { await mediaSet('art:' + e.id, e.art); e.art = 'idb:art:' + e.id; }
  persist();
  hydrateIcons();
  renderMenu();
  menuEl.inert = false;
  tickWorld(); setInterval(() => { if (menuOpen) tickWorld(); }, 6000);
  if (loginReady()) openLogin();
  requestAnimationFrame(loop);
})();
setInterval(() => { if (menuOpen && !modalEl) renderMenu(); }, 60000);
</script>
