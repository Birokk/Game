<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blank: Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
</head>
<body>
<canvas id="world" aria-label="Plaza world"></canvas>

<div class="wallpaper on" id="wallpaper" aria-hidden="true">
  <div class="wp-stars"></div>
  <div class="wp-moon"></div>
  <div class="wp-glow"></div>
  <div class="wp-name" id="wpName">Blank: Project</div>
  <div class="wp-pearls" id="wpPearls"></div>
  <svg class="wp-waves" viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0 190C240 130 480 250 720 190S1200 130 1440 190V320H0Z" fill="rgba(255,255,255,.07)"/><path d="M0 245C300 195 540 295 840 245S1260 205 1440 245V320H0Z" fill="rgba(255,255,255,.09)"/></svg>
  <img class="wp-blur" id="wpBlur" alt="" hidden>
  <img class="wp-splash" id="wpSplash" alt="" hidden>
</div>

<div class="title" id="title" role="dialog" aria-label="Blank: Project title screen">
  <div class="tt-bg"><div class="wp-stars"></div><div class="tt-moon"></div><div class="tt-rays"></div></div>
  <img class="tt-img" id="ttImg" alt="" hidden>
  <div class="tt-shade"></div>
  <div class="tt-motes" id="ttMotes"></div>
  <div class="tt-logo"><span class="tt-kicker">✦ A Lantern Festival Gacha ✦</span><h1>Blank: Project</h1><span class="tt-sub">Collect · Bond · Celebrate</span></div>
  <div class="tt-center">
    <button class="tt-start" id="ttStart">Tap to start</button>
    <div class="tt-who" id="ttWho"></div>
  </div>
  <nav class="tt-side" aria-label="Title menu">
    <button class="tt-ib" id="ttNews"><span data-ic="mail"></span>Notice</button>
    <button class="tt-ib" id="ttSupport"><span data-ic="chat"></span>Support</button>
    <button class="tt-ib" data-open="settings"><span data-ic="gear"></span>Settings</button>
    <button class="tt-ib" id="ttRepair"><span data-ic="wrench"></span>Repair</button>
    <button class="tt-ib" id="ttTerms"><span data-ic="info"></span>Terms</button>
  </nav>
  <div class="tt-foot"><span>v0.9.0 · Server: Blank-1</span><span id="ttUid"></span><span>© 2026 Blank: Project</span></div>
</div>

<main class="menu is-open" id="menu" aria-label="Main menu">
  <header class="hm hm-tl">
    <button class="hm-me" data-open="profile" aria-label="Open your profile"><span style="position:relative;display:block" id="hmAvatar"></span>
      <span class="hm-id ts"><span class="hm-name" id="pname">Traveler</span><span id="hmTitle"></span></span></button>
    <div class="hm-tools">
      <button class="tool ts" data-open="wallpaper"><span class="tc glass"><span data-ic="image"></span></span>Wallpaper</button>
      <button class="tool ts" id="hideUi" aria-label="Hide the menu and show only the wallpaper"><span class="tc glass"><span data-ic="eyeOff"></span></span>Hide UI</button>
    </div>
  </header>

  <div class="hm hm-tr">
    <div class="currencies" id="wallet" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <button class="rbtn glass" data-open="mail" aria-label="Mail"><span data-ic="mail"></span><span class="badge" id="mailBadge"></span></button>
    <button class="rbtn glass" data-open="settings" aria-label="Settings"><span data-ic="gear"></span></button>
    <button class="rbtn glass" data-open="admin" aria-label="Admin panel"><span data-ic="wrench"></span></button>
  </div>
  <button class="hm ticker ts" id="ticker" aria-label="World chat, enter the plaza to talk"><span data-ic="chat"></span><span id="tickerText"></span></button>

  <nav class="hm hm-left" aria-label="Banners and activities">
    <div id="promo"></div>
    <div class="ev-grid">
      <button class="ev ts" data-open="spin"><span class="evo"><span data-ic="wheel"></span></span><span class="el">Daily Spin</span><time>Free</time><span class="dot-n" id="spinDot" hidden></span></button>
      <button class="ev ts" data-open="events" style="--ec:#ff6f91"><span class="evo"><span data-ic="calendar"></span></span><span class="el">Events</span><span class="dot-n" id="evDot" hidden></span></button>
      <button class="ev ts" data-open="ranking" style="--ec:#ffb84a"><span class="evo"><span data-ic="trophy"></span></span><span class="el">Ranking</span></button>
      <button class="ev ts" data-open="friends" style="--ec:#5aa9ff"><span class="evo"><span data-ic="friends"></span></span><span class="el">Friends</span></button>
    </div>
  </nav>

  <nav class="hm hm-right" aria-label="Shop and items">
    <button class="ev ts" data-open="shop" style="--ec:#ff9f43"><span class="evo"><span data-ic="shop"></span></span><span class="el">Shop</span></button>
    <button class="ev ts" data-open="quests" style="--ec:#4fd1a5"><span class="evo"><span data-ic="quests"></span></span><span class="el">Quests</span><time>Daily</time><span class="dot-n" id="qDot" hidden></span></button>
    <button class="ev ts" data-open="bag" style="--ec:#a78bfa"><span class="evo"><span data-ic="bag"></span></span><span class="el">Bag</span></button>
    <button class="ev ts" data-open="team" style="--ec:#c58bff"><span class="evo"><span data-ic="team"></span></span><span class="el">Team</span></button>
    <button class="ev ts" data-open="level" style="--ec:#3fd47e"><span class="evo"><span data-ic="level"></span></span><span class="el">Level</span><span class="dot-n" id="lvDot" hidden></span></button>
    <button class="ev ts" data-open="ach"><span class="evo"><span data-ic="trophy"></span></span><span class="el">Achievements</span><span class="dot-n" id="achDot" hidden></span></button>
    <button class="ev ts" data-open="redeem"><span class="evo"><span data-ic="gift"></span></span><span class="el">Redeem</span></button>
  </nav>

  <button class="hm portal" id="enterPlaza" aria-label="Enter the plaza"><span class="g-arch"><span class="g-motes"></span><span class="g-roof"></span><span class="g-lan"></span><span class="g-lan r"></span></span><span class="plbl ts">Enter Plaza</span></button>
  <button class="hm portal raidgate" id="enterRaids" data-open="raids" aria-label="Open Raids"><span class="g-arch"><span class="g-motes"></span><span class="rg-door"></span><span class="rg-sword"></span><span class="g-lan"></span><span class="g-lan r"></span></span><span class="plbl ts">Raids</span></button>

  <nav class="hm hm-tabs" aria-label="Collection">
    <button class="tabb ts" data-open="characters">Characters<span class="dot-n" id="charDot" hidden></span></button>
    <button class="tabb ts" data-open="pets">Pets<span class="dot-n" id="petDot" hidden></span></button>
    <button class="tabb ts" data-open="farm">Base<span class="dot-n" id="farmDot" hidden></span></button>
    <button class="tabb ts" data-open="collection">Collection</button>
  </nav>

  <div class="hm hm-br">
    <button class="summon2" data-open="summon" data-banner="limited"><span class="so"><span data-ic="sparkle"></span></span><span class="st"><b>Summon</b></span><span class="dot-n" id="sumDot" hidden></span></button>
    <span class="lim-time" id="limTime"></span>
  </div>

  <button class="unhide glass" id="unhide" aria-label="Show the menu again"><span data-ic="eye"></span></button>
  <button class="wp-arrow prev" id="wpPrev" aria-label="Previous wallpaper" tabindex="-1"><span data-ic="back"></span></button>
  <button class="wp-arrow next" id="wpNext" aria-label="Next wallpaper" tabindex="-1"><span data-ic="back"></span></button>
</main>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="hud-left">
      <div class="row" style="gap:8px">
        <div class="pill glass"><span class="dot"></span><b id="zoneName">Pearl Fountain</b><span class="muted" id="onlineCount"></span></div>
        <button class="hbtn glass" id="peopleBtn" aria-label="People in the plaza"><span data-ic="friends"></span><span>People</span></button>
      </div>
      <div class="people glass-deep" id="people" hidden></div>
    </div>
    <div class="hud-right">
      <div class="hud-actions">
        <button class="hbtn glass" id="mapBtn"><span data-ic="map"></span><span>Map</span></button>
        <button class="hbtn glass gold" data-open="summon"><span data-ic="sparkle"></span><span>Summon</span></button>
        <button class="hbtn glass" id="openMenu"><span data-ic="grid"></span><span>Menu</span></button>
      </div>
      <button class="minimap glass" id="minimapBtn" aria-label="Open the map"><canvas id="minimap"></canvas><span id="miniLabel">Pearl Fountain</span></button>
    </div>
  </div>
  <div class="zone-title" id="zoneTitle" aria-live="polite"><span class="eyebrow">Blank: Project</span><b></b><small></small></div>
  <div class="hint glass" id="hint">WASD or arrow keys to walk · tap the ground to move · M for map · Esc for menu</div>
  <div class="hud-bottom">
    <div class="chatlog glass" id="chatlog" aria-live="polite"></div>
    <div class="chatwrap">
      <div class="emotes glass" id="emotes" hidden></div>
      <form class="chatbar glass" id="chatForm" autocomplete="off">
        <button type="button" class="iconbtn" id="emoteToggle" aria-label="Emotes"><span data-ic="smile"></span></button>
        <input id="chatInput" maxlength="80" placeholder="Say something… (Enter)" aria-label="Chat message">
        <button type="submit" class="iconbtn send" aria-label="Send"><span data-ic="send"></span></button>
      </form>
    </div>
    <div></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
