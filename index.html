<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prism Plaza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: wallpaper fills the main screen; frosted-glass UI frames it (top bar, left rail, right banner + rail, bottom dock); closing the menu reveals the isometric plaza */
:root{
  --ink:#0a0f1f; --ink-2:#141d3c; --text:#f3f6ff; --muted:#b3bedf; --faint:#7f8bb3;
  --glass:rgba(18,26,56,.34); --glass-hi:rgba(255,255,255,.16); --glass-deep:rgba(15,21,44,.66);
  --edge:rgba(255,255,255,.24); --edge-soft:rgba(255,255,255,.12); --field:rgba(4,8,22,.38);
  --mint:#7ef3d4; --mint-ink:#06352b; --gold:#ffd36b; --gold-ink:#4a2a00; --pearl:#efe6ff; --pink:#ff9ec4; --danger:#ff8a9a;
  --r3:#74c7ff; --r4:#ffaa5c; --r5:#d07bff;
  --ur:linear-gradient(120deg,#a855f7,#ff6ec7 50%,#3ee6d0);
  --display:"Lilita One","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
[data-ic]{display:contents}
.ic{width:22px;height:22px;flex:none}
img.ic,img.cic{object-fit:contain}
.cic{width:20px;height:20px;flex:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 32px rgba(0,0,0,.22)}
.glass-deep{background:var(--glass-deep);border:1px solid var(--edge);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 24px 60px rgba(0,0,0,.45)}

/* ---------- Wallpaper ---------- */
.wallpaper{position:fixed;inset:0;z-index:15;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .45s ease;
  background:linear-gradient(180deg,#0b1238 0%,#1b2768 34%,#4d3a9e 62%,#c776b8 86%,#ffb3cf 100%)}
.wallpaper.on{opacity:1}
.wp-moon{position:absolute;left:50%;top:9%;width:min(40vw,440px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffffff 0%,#f7efff 22%,#dccbff 52%,#a891e6 78%,#7f6cc9 100%);
  box-shadow:0 0 80px 20px rgba(220,200,255,.35),0 0 200px 60px rgba(180,150,255,.18);opacity:.92}
.wp-moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,rgba(255,180,220,.0),rgba(255,180,220,.35),rgba(140,230,255,.3),rgba(255,255,255,0) 60%);mix-blend-mode:screen}
.wp-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 72%,rgba(255,170,210,.35),transparent 60%)}
.wallpaper.has-char .wp-glow{background:radial-gradient(ellipse at 50% 62%,color-mix(in srgb,var(--rc) 55%,transparent),transparent 58%)}
.wallpaper.has-char .wp-moon{opacity:.55}
.wp-stars{position:absolute;inset:0 0 40% 0;background:
  radial-gradient(circle at 12% 20%,rgba(255,255,255,.9) 1px,transparent 1.6px) 0 0/140px 120px,
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.6) 1px,transparent 1.6px) 0 0/110px 90px,
  radial-gradient(circle at 40% 80%,rgba(255,230,250,.7) 1.2px,transparent 1.8px) 0 0/190px 160px;opacity:.8}
.wp-name{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(70px,17vw,260px);line-height:.9;white-space:nowrap;color:rgba(255,255,255,.09);letter-spacing:.02em;pointer-events:none}
.wp-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
.wp-pearls{position:absolute;inset:0}
.wp-pearls i{position:absolute;bottom:-12%;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#f4ecff 30%,#cdb9f5 70%,rgba(160,140,230,.5));box-shadow:0 0 14px rgba(230,210,255,.5);animation:rise linear infinite;opacity:.75}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(18px,-60vh)}to{transform:translate(-8px,-125vh)}}
.wp-blur{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(130%) brightness(.6)}
.wallpaper.chibi .wp-blur{display:none!important}
.wp-splash{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%;animation:wpZoom 20s ease-in-out infinite alternate}
.wallpaper.chibi .wp-splash{top:auto;bottom:4%;height:78%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%}
@keyframes wpZoom{to{transform:scale(1.05)}}
@keyframes breathe{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.wp-chip{height:40px;padding:0 16px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;transition:background .2s}
.wp-chip:hover{background:var(--glass-hi)}
.wp-chip b{font-weight:900}


.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.profile{display:flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;border-radius:999px}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--ink-2);border:2px solid var(--mint);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;transform:scale(1.6);transform-origin:50% 54%}
.pname{font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1.1}
.lvl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.xp{width:84px;height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#b9fff0);border-radius:9px}
.currencies{display:flex;gap:8px;flex-wrap:wrap}
.cur{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 10px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums}
.cur .plus{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi)}
.cur .plus .ic{width:14px;height:14px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{position:relative;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;transition:background .2s,transform .2s}
.iconbtn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#3a0710;font-size:11px;font-weight:900;display:grid;place-items:center}
.iconbtn.enter{color:var(--mint)}

.rail{display:flex;flex-direction:column;justify-content:center;gap:12px}
.gbtn{width:78px;height:78px;border-radius:24px;display:grid;place-content:center;justify-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.02em;transition:background .2s,transform .2s}
.gbtn .ic{width:27px;height:27px}
.gbtn:hover{background:var(--glass-hi);transform:translateY(-2px)}
.stage{display:flex;align-items:flex-end;justify-content:center;min-height:0}
.side-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:12px}
.rail-right{display:grid;grid-template-columns:repeat(2,78px);gap:12px}

.bmini{position:relative;width:268px;display:grid;grid-template-columns:70px minmax(0,1fr);text-align:left;border-radius:24px;overflow:hidden;transition:transform .2s}
.bmini:hover{transform:translateY(-2px)}
.bmini-art{position:relative;aspect-ratio:9/16;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 45%,var(--ink-2)),var(--ink-2))}
.bmini-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.bmini-info{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bmini-name{font-family:var(--display);font-size:21px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmini .stars{font-size:12px}
.bmini .timer{font-size:12px;margin-top:auto}
.bmini .timer .ic{width:15px;height:15px}
.banner-tag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:999px;background:var(--rc);color:#1d1400;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stars{color:var(--rc);letter-spacing:.08em;font-size:16px;text-shadow:0 0 12px color-mix(in srgb,var(--rc) 60%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--glass-hi);border:1px solid var(--edge-soft);font-size:12px;font-weight:800}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--el,#fff)}
.chip.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.desc{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.timer{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.timer b{color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:900;letter-spacing:.02em;transition:transform .15s,filter .2s,background .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.gold{background:linear-gradient(180deg,#ffeaa6,#ffc94f 55%,#f5a332);color:var(--gold-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 20px rgba(255,190,70,.35)}
.btn.mint{background:linear-gradient(180deg,#b9fff0,var(--mint));color:var(--mint-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.btn.ghost{background:var(--glass-hi);border:1px solid var(--edge-soft)}
.btn.danger{background:color-mix(in srgb,var(--danger) 25%,transparent);border:1px solid color-mix(in srgb,var(--danger) 55%,transparent);color:#ffd9de}
label.btn{cursor:pointer}
label.btn:focus-within{outline:2px solid var(--mint);outline-offset:2px}
.link{color:var(--mint);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:0}
.cost{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cost .cic{width:17px;height:17px}

.dock{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.summon{position:relative;overflow:hidden;height:86px;padding:0 40px;border-radius:28px;display:grid;place-content:center;justify-items:center;gap:2px;
  background:linear-gradient(180deg,#fff0b8,#ffcb52 50%,#f59a2c);color:var(--gold-ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(160,80,0,.25),0 14px 44px rgba(255,186,64,.45);transition:transform .2s}
.summon:hover{transform:translateY(-2px) scale(1.02)}
.summon .lbl{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:32px;line-height:1}
.summon .lbl .ic{width:30px;height:30px}
.summon small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900;opacity:.8;letter-spacing:.04em}
.summon small .cic{width:15px;height:15px}
.summon::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.dock .gbtn{width:auto;height:64px;padding:0 20px;grid-auto-flow:column;gap:10px;font-size:15px;font-weight:900}
.dock .enter-plaza{color:var(--mint)}

/* ---------- World HUD ---------- */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;justify-content:space-between}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud-top>*,.hud-bottom>*,.hint{pointer-events:auto}
.pill{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:13px}
.pill b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.muted{color:var(--muted)}
.hud-actions{display:flex;gap:8px}
.hbtn{height:44px;padding:0 14px;border-radius:15px;display:flex;align-items:center;gap:8px;font-weight:900}
.hbtn.gold{color:var(--gold)}
.hud-left{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.minimap{display:grid;gap:4px;padding:6px;border-radius:18px;justify-items:center;transition:background .2s}
.minimap:hover{background:var(--glass-hi)}
.minimap canvas{width:200px;height:112px;border-radius:12px;background:radial-gradient(circle,#22356b,#0b1238);display:block}
.minimap span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.people{width:min(300px,calc(100vw - 32px));max-height:50vh;overflow-y:auto;border-radius:18px;padding:6px;display:grid;gap:2px}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:12px}
.prow:hover{background:var(--glass)}
.prow i{width:10px;height:10px;border-radius:50%}
.prow b{display:block;font-size:13px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.zone-title{position:fixed;left:50%;top:24%;transform:translateX(-50%);text-align:center;opacity:0;pointer-events:none;display:grid;gap:2px;justify-items:center;width:max-content;max-width:calc(100vw - 32px)}
.zone-title b{font-family:var(--display);font-weight:400;font-size:clamp(34px,6.5vw,68px);line-height:1;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#ffffff 30%,var(--zc,#7ef3d4));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(10,15,31,.35)) drop-shadow(0 0 22px color-mix(in srgb,var(--zc,#7ef3d4) 55%,transparent))}
.zone-title small{font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(10,15,31,.7)}
.zone-title .eyebrow{color:#fff;text-shadow:0 1px 3px rgba(10,15,31,.7)}
.zone-title.show{animation:zoneIn 3s ease both}
@keyframes zoneIn{0%{opacity:0;transform:translate(-50%,12px)}12%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
.tele-flash{position:fixed;inset:0;z-index:12;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(126,243,212,.35) 40%,transparent 70%);animation:flash .6s ease-out forwards}
.map-wrap{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#22356b,#0b1238);border:1px solid var(--edge-soft)}
.map-wrap canvas{display:block;width:100%;aspect-ratio:2/1.08}
.pin{position:absolute;transform:translate(-50%,-50%);padding:5px 11px;border-radius:999px;font-weight:900;font-size:12px;white-space:nowrap;background:rgba(10,15,31,.78);border:1.5px solid var(--zc);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s}
.pin:hover{transform:translate(-50%,-50%) scale(1.06)}
.pin.here{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.zone-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.zcard{display:grid;gap:6px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--edge-soft)}
.zcard h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}
.zcard h4 i{width:10px;height:10px;border-radius:50%;background:var(--zc);box-shadow:0 0 10px var(--zc)}
.zcard p{margin:0;font-size:13px;color:var(--muted)}
.hint{align-self:center;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;transition:opacity .6s}
.hint.gone{opacity:0}
.hud-bottom{display:grid;grid-template-columns:minmax(0,340px) minmax(0,520px) 1fr;align-items:end;gap:12px}
.chatlog{border-radius:18px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:hidden;min-width:0}
.chatlog div{overflow-wrap:anywhere}
.chatlog b{font-weight:900}
.chatlog .sys{color:var(--muted);font-style:italic}
.chatwrap{position:relative}
.chatbar{display:flex;align-items:center;gap:6px;padding:6px;border-radius:18px}
.chatbar input{flex:1;min-width:0;height:38px;border:0;background:transparent;padding:0 6px;outline:none;font-weight:700}
.chatbar input::placeholder{color:var(--faint)}
.chatbar .iconbtn{width:38px;height:38px;border-radius:12px}
.chatbar .send{background:var(--mint);color:var(--mint-ink)}
.emotes{position:absolute;bottom:calc(100% + 8px);left:0;display:flex;gap:4px;padding:6px;border-radius:16px}
.emotes button{width:40px;height:40px;border-radius:12px;font-size:22px;transition:background .15s,transform .15s}
.emotes button:hover{background:var(--glass-hi);transform:translateY(-2px)}

/* ---------- Modals ---------- */
.modal-back{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,20,.4);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fade .2s ease}
.modal{width:min(580px,100%);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-radius:28px;overflow:hidden;overflow:clip;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(1020px,100%)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 20px;border-bottom:1px solid var(--edge-soft)}
.m-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em;flex:1;min-width:0}
.m-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-hi);color:var(--mint);flex:none}
.m-body{padding:18px 20px 22px;overflow-y:auto;min-height:0}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em}
.tiny{font-size:12px;color:var(--faint);margin:0}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl-sm{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.ph{display:grid;gap:16px}
.ph-hero{display:flex;gap:14px;align-items:center}
.ph-hero .m-ic{width:56px;height:56px;border-radius:18px}
.ph-hero .ic{width:28px;height:28px}
.ph-hero p{margin:4px 0 0;color:var(--muted)}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.skel div{height:86px;border-radius:16px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 70%);background-size:300% 100%;animation:shim 1.8s linear infinite;border:1px solid var(--edge-soft)}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}

/* summon modal */
.sm-hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.sm-art{aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 40%,var(--ink-2)),var(--ink-2));border:2px solid var(--rc)}
.sm-art img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.rateups{display:flex;gap:8px;flex-wrap:wrap}
.rateups img{width:46px;height:46px;border-radius:12px;object-fit:cover;object-position:50% 14%;border:2px solid var(--rc);background:var(--ink-2)}
.rates{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.rates td{padding:8px 4px;border-bottom:1px solid var(--edge-soft)}
.rates td:last-child{text-align:right;font-weight:800;color:var(--muted)}
.pity{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13px;font-weight:800}
.pity>div{display:grid;gap:6px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--rc)}
.balance{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft);font-weight:800}
.balance b{display:inline-flex;align-items:center;gap:6px;font-size:18px;font-variant-numeric:tabular-nums}
.pulls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pulls .btn{height:64px;flex-direction:column;gap:2px;line-height:1.1;font-size:17px}
.pulls .btn .cost{font-size:13px;opacity:.85}
.hist{display:grid;gap:4px;max-height:220px;overflow-y:auto;margin-top:8px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--glass)}
.hist span:first-child{font-weight:800;color:var(--rc)}
.hist time{color:var(--faint);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:900}
.notice{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 16%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);font-size:13px;font-weight:800}

/* pull animation: intro keyed to the best result. t3 = gold coins (blue), t4 = SSR (light orange), t5 = UR (purple, pink, turquoise) */
.pull{position:fixed;inset:0;z-index:90;overflow:hidden;cursor:pointer;color:#fff;animation:fade .3s;
  --p1:#5aa9ff;--p2:#9fd3ff;--p3:#ffffff;--tB:1s;
  background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--p1) 30%,transparent),transparent 60%),
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.8) 1px,transparent 1.5px) 0 0/120px 120px,
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.55) 1px,transparent 1.5px) 0 0/90px 90px,#050816}
.pull.t4{--p1:#ff8a2a;--p2:#ffb067;--p3:#ffe2b8;--tB:1.55s}
.pull.t5{--p1:#a855f7;--p2:#ff6ec7;--p3:#3ee6d0;--tB:2.1s}
.pfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.meteor-wrap{position:absolute;top:-6%;left:88%;animation:fly 1s cubic-bezier(.45,0,.75,.55) forwards,meteorOut .2s .95s forwards}
@keyframes meteorOut{to{opacity:0}}
@keyframes fly{to{transform:translate(-38vw,56vh)}}
.meteor{width:min(44vw,420px);height:6px;border-radius:6px;background:linear-gradient(90deg,#fff,var(--p3) 8%,var(--p2) 30%,var(--p1) 60%,transparent);transform:rotate(-40deg);transform-origin:0 50%;position:relative;filter:drop-shadow(0 0 8px var(--p2))}
.meteor::before{content:"";position:absolute;left:-9px;top:-6px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 22px 10px var(--p2),0 0 70px 26px color-mix(in srgb,var(--p1) 60%,transparent)}
.orb{position:absolute;left:50%;top:50%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,#fff 0 18%,color-mix(in srgb,var(--p3) 85%,#fff) 30%,color-mix(in srgb,var(--p2) 70%,transparent) 52%,transparent 70%);
  animation:orbCharge calc(var(--tB) - 1s) 1s ease-in both,orbBurst .6s var(--tB) ease-out forwards}
.orb::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:conic-gradient(var(--p1),var(--p2),var(--p3),var(--p2),var(--p1));
  -webkit-mask:radial-gradient(circle,transparent 56%,#000 58%,#000 64%,transparent 66%);mask:radial-gradient(circle,transparent 56%,#000 58%,#000 64%,transparent 66%);animation:spin 1.2s linear infinite}
.orb::after{content:"";position:absolute;inset:-60%;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--p2) 35%,transparent) 0 4deg,transparent 4deg 14deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 6s linear infinite reverse}
.t3 .orb,.t3 .rings,.t3 .stamp{display:none}
@keyframes orbCharge{0%{opacity:0;transform:scale(.1)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes orbBurst{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.rings i{position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;margin:-10vmin 0 0 -10vmin;border-radius:50%;border:3px solid var(--p2);opacity:0;pointer-events:none;animation:ring 1.1s var(--tB) ease-out forwards}
.rings i:nth-child(2){border-color:var(--p1);animation-delay:calc(var(--tB) + .12s)}
.rings i:nth-child(3){border-color:var(--p3);animation-delay:calc(var(--tB) + .24s)}
@keyframes ring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(9);border-width:1px}}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff,color-mix(in srgb,var(--p2) 70%,#fff) 25%,transparent 70%);animation:flash .9s var(--tB) ease-out forwards}
.t5 .flash{background:radial-gradient(circle at 50% 50%,#fff 0 12%,transparent 60%),conic-gradient(from 0deg at 50% 50%,rgba(168,85,247,.85),rgba(255,110,199,.85),rgba(62,230,208,.85),rgba(168,85,247,.85))}
@keyframes flash{25%{opacity:1}100%{opacity:0}}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(90px,22vmin,220px);line-height:1;letter-spacing:.04em;opacity:0;pointer-events:none;z-index:3;animation:stamp 1s calc(var(--tB) + .15s) cubic-bezier(.2,1.4,.4,1) both}
.t4 .stamp{color:#fff3e2;text-shadow:0 0 30px #ffaa5c,0 0 70px #ff8a2a}
.t5 .stamp{background:linear-gradient(90deg,#c58bff,#ff8ad6,#5ff2dd,#c58bff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,110,199,.7));animation:stamp 1s calc(var(--tB) + .15s) cubic-bezier(.2,1.4,.4,1) both,shimmer 1.4s linear infinite}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes shimmer{to{background-position:-200% 0}}
.pull.revealing .meteor-wrap,.pull.revealing .flash,.pull.revealing .orb,.pull.revealing .rings,.pull.revealing .stamp{display:none}
.pull-skip{position:absolute;z-index:4;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.rv-flash{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle,#fff,color-mix(in srgb,var(--rc) 60%,transparent) 50%,transparent 80%);animation:flash .7s ease-out forwards}
.rv.r5 .rv-flash{background:radial-gradient(circle,#fff 0 10%,transparent 60%),conic-gradient(rgba(168,85,247,.8),rgba(255,110,199,.8),rgba(62,230,208,.8),rgba(168,85,247,.8))}
.rv-sweep{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;background-size:260% 100%;background-repeat:no-repeat;
  background-image:linear-gradient(110deg,transparent 40%,color-mix(in srgb,var(--rc) 50%,transparent) 47%,rgba(255,255,255,.7) 50%,color-mix(in srgb,var(--rc) 50%,transparent) 53%,transparent 60%);
  animation:sweep 1.3s .3s cubic-bezier(.4,0,.2,1) both}
.rv.r5 .rv-sweep{background-image:linear-gradient(110deg,transparent 37%,rgba(168,85,247,.5) 44%,rgba(255,110,199,.6) 47.5%,rgba(255,255,255,.8) 50%,rgba(62,230,208,.6) 52.5%,rgba(168,85,247,.4) 56%,transparent 63%);animation:sweep 1.3s .3s cubic-bezier(.4,0,.2,1) both,sweep 1.5s 1.9s cubic-bezier(.4,0,.2,1)}
.rv.r3 .rv-sweep{display:none}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
.rv.r5 .rv-splash{animation:rvZoom .9s cubic-bezier(.2,.9,.3,1) both,impact .45s .05s ease-out}
@keyframes impact{0%,100%{translate:0 0}20%{translate:-5px 3px}40%{translate:4px -3px}60%{translate:-3px 2px}80%{translate:2px -1px}}
.rv-tier{justify-self:start;animation:tierIn .55s .3s cubic-bezier(.2,1.5,.4,1) both}
@keyframes tierIn{from{opacity:0;transform:scale(2.2) rotate(-6deg)}}
/* rarity tags */
.rtag{display:inline-flex;align-items:center;justify-content:center;padding:1px 7px;border-radius:7px;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.06em;line-height:1.35;vertical-align:middle;white-space:nowrap}
.rtag.r5{background:linear-gradient(90deg,#a855f7,#ff6ec7,#3ee6d0,#a855f7);background-size:200% 100%;color:#fff;text-shadow:0 1px 1px rgba(60,0,80,.45);box-shadow:0 0 12px rgba(255,110,199,.45);animation:shimmer 3s linear infinite}
.rtag.r4{background:linear-gradient(180deg,#ffd6a6,#ff9a45);color:#4a1d00;box-shadow:0 0 12px rgba(255,160,80,.6)}
.rtag.lg{font-size:18px;padding:2px 10px;border-radius:9px}
.rtag.xl{font-size:clamp(30px,4vw,48px);padding:2px 16px;border-radius:14px}
.card.r5,.scard.r5,.sm-hero.r5 .sm-art,.detail.r5 .detail-art,.ad-preview.r5 .frame{border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,#a855f7 32%,var(--ink-2)),var(--ink-2)) padding-box,var(--ur) border-box}
.card.r5,.scard.r5{box-shadow:0 0 16px rgba(200,110,255,.4)}
.card.r4,.scard.r4{box-shadow:0 0 14px rgba(255,160,80,.35)}
.seg label.r5:has(input:checked){background:var(--ur);color:#fff}
.rv{position:absolute;inset:0;overflow:hidden}
.rv-rays{position:absolute;left:50%;top:55%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 5deg,transparent 5deg 15deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rv-glow{position:absolute;inset:0;background:radial-gradient(circle at 60% 58%,color-mix(in srgb,var(--rc) 60%,transparent),transparent 55%)}
.rv-splash{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;animation:rvZoom .9s cubic-bezier(.2,.9,.3,1) both}
.rv-blur{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(130%) brightness(.7);display:none}
.rv.fit .rv-blur{display:block}
.rv.fit .rv-splash{object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 0 40px color-mix(in srgb,var(--rc) 50%,transparent))}
.rv.has-art .rv-rays,.rv.has-art .rv-glow{display:none}
.rv.has-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(5,8,22,.85))}
@keyframes rvZoom{from{opacity:0;scale:1.08}}
.rv-coin{position:absolute;right:16%;top:50%;width:min(36vw,240px);height:min(36vw,240px);transform:translateY(-50%);display:grid;place-items:center;animation:rvIn .7s cubic-bezier(.2,.9,.3,1) both}
.rv-coin .cic{width:100%;height:100%}
@keyframes rvIn{from{opacity:0;translate:70px 0;scale:.96}}
.rv-info{position:absolute;left:max(24px,6vw);bottom:16%;display:grid;gap:10px;max-width:46%;z-index:2}
.rv-name{font-family:var(--display);font-size:clamp(46px,7.5vw,104px);line-height:.92;text-wrap:balance;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:rvIn .6s .15s both}
.rv-stars{display:flex;gap:4px;font-size:clamp(26px,3.4vw,40px);color:var(--rc);text-shadow:0 0 18px var(--rc)}
.rv-stars span{animation:starPop .35s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.35s + var(--i) * .12s)}
@keyframes starPop{from{opacity:0;transform:scale(.2) rotate(-40deg)}}
.rv-badge{justify-self:start;padding:4px 12px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--mint);color:var(--mint-ink);animation:rvIn .4s .7s both}
.rv-badge.dupe{background:rgba(255,255,255,.16);color:var(--gold);letter-spacing:.02em;text-transform:none}
.rv-count{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));font-weight:900;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7);z-index:2}
.rv-hint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.6);z-index:2}
.sum{position:absolute;inset:0;display:grid;align-content:safe center;justify-items:center;gap:22px;cursor:default;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(5,8,22,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow-y:auto}
.sum h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.sum-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:min(780px,100%)}
.sum-grid.one{grid-template-columns:minmax(0,220px);justify-content:center}
.scard{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--rc);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 35%,var(--ink-2)),var(--ink-2));animation:pop .35s both;animation-delay:calc(var(--i) * .05s)}
.scard img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:50% 50%;display:block}
.scard .coinbox{aspect-ratio:9/16;display:grid;place-items:center;padding:22%}
.scard .coinbox .cic{width:100%;height:auto;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,211,107,.45))}
.scard .foot{padding:6px 8px 8px;background:rgba(5,8,20,.5);display:grid;gap:0}
.scard .nm{font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .st{color:var(--rc);font-size:10px;letter-spacing:.06em}
.scard .new{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font-size:10px;font-weight:900;letter-spacing:.1em}
.scard .dp{font-size:11px;color:var(--gold);font-weight:800}

/* mail */
.mail{display:grid;gap:10px}
.mail-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge-soft)}
.mail-row h4{margin:0;font-size:15px;font-weight:900}
.mail-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.mail-row .meta{font-size:12px;color:var(--faint);font-weight:700}
.reward{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;font-weight:900}

/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-width:0;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--edge);background:var(--field);font-weight:700;outline:none}
textarea.input{height:auto;min-height:78px;padding:10px 12px;resize:vertical;font-weight:600}
.input:focus{border-color:var(--mint)}
.err{color:var(--danger);font-size:12px;font-weight:800}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft);font-weight:800;cursor:pointer}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:var(--mint)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--mint);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--field);border:1px solid var(--edge)}
.seg label{flex:1;text-align:center;padding:7px 0;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--rc);color:#1d1400}
.seg label:has(input:focus-visible){outline:2px solid var(--mint)}

/* collection */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tab{height:36px;padding:0 14px;border-radius:12px;background:var(--glass);border:1px solid var(--edge-soft);font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.tab span{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tab.on{background:var(--mint);color:var(--mint-ink);border-color:transparent}
.tab.on span{color:var(--mint-ink)}
.tabs .switch{padding:6px 10px;margin-left:auto;font-size:13px}
.tabs .switch i{width:38px;height:22px}
.tabs .switch i::after{width:16px;height:16px}
.tabs .switch input:checked+i::after{transform:translateX(16px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;text-align:left;border:2px solid var(--rc);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 28%,var(--ink-2)),var(--ink-2));transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px color-mix(in srgb,var(--rc) 35%,transparent)}
.card img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:50% 50%;display:block}
.card.locked img{filter:grayscale(.85) brightness(.55)}
.card.locked{border-color:color-mix(in srgb,var(--rc) 35%,transparent)}
.card .own{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:999px;background:rgba(5,8,20,.65);font-size:11px;font-weight:900;font-variant-numeric:tabular-nums}
.card.locked .own{color:var(--muted)}
.stars6{display:inline-flex;gap:1px;letter-spacing:0;line-height:1}
.stars6 span{color:rgba(255,255,255,.22)}
.stars6 span.on{color:#ffd36b;text-shadow:0 0 6px rgba(255,211,107,.75)}
.stars6 span.pop{animation:starPop .6s .85s cubic-bezier(.2,1.6,.4,1) both}
.rv-up{display:grid;gap:4px;justify-items:start;animation:rvIn .4s .7s both}
.rv-up .stars6{font-size:clamp(24px,3.2vw,36px);gap:3px}
.rv-up>span:last-child{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px;color:var(--gold)}
.rv-up .cic{width:18px;height:18px}
.stars-big{display:grid;gap:4px}
.stars-big .stars6{font-size:22px;gap:2px}
.card-foot{padding:8px 10px 10px;background:rgba(5,8,20,.45);display:grid;gap:1px}
.card .stars{font-size:11px}
.card-name{font-weight:900;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-type{font-size:11px;color:var(--muted);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:18px}
.detail{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px}
.detail-art{border-radius:22px;overflow:hidden;border:2px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 35%,var(--ink-2)),var(--ink-2))}
.detail-art img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:50% 50%;display:block}
.detail h3{font-size:36px;line-height:1}
.r3{--rc:var(--r3)} .r4{--rc:var(--r4)} .r5{--rc:var(--r5)}

/* wallpaper picker */
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.wpt{position:relative;aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:2px solid var(--edge-soft);text-align:left;transition:transform .2s}
.wpt:hover{transform:translateY(-2px)}
.wpt.on{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 35%,transparent)}
.wpt .mini{position:absolute;inset:0;background:linear-gradient(180deg,#0b1238,#1b2768 34%,#4d3a9e 62%,#c776b8 86%,#ffb3cf)}
.wpt .mini::before{content:"";position:absolute;left:50%;top:10%;width:56%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#dccbff 52%,#8f7bd6);opacity:.85}
.wpt .mini::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--rc,#ffaad2) 55%,transparent),transparent 60%)}
.wpt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.wpt .lab{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(5,8,20,.85));font-weight:900;font-size:13px}
.wpt .chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center}
.wpt .chk .ic{width:15px;height:15px}

/* admin */
.admin{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ad-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px}
.ad-preview{display:grid;gap:8px;align-content:start}
.ad-preview .frame{aspect-ratio:9/16;border-radius:18px;overflow:hidden;border:2px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 35%,var(--ink-2)),var(--ink-2))}
.ad-preview img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;border:1px dashed var(--mint);color:var(--mint);font-weight:900;font-size:13px;cursor:pointer}
.upload:focus-within{outline:2px solid var(--mint);outline-offset:2px}
.ad-fields{display:grid;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px;border-radius:14px;border:1px solid var(--edge-soft);background:var(--glass);margin:0}
.looks legend{padding:0 6px}
.looks label{display:grid;gap:4px;font-size:11px;font-weight:800;color:var(--muted)}
.looks input[type=color]{width:100%;height:34px;border:1px solid var(--edge);border-radius:10px;background:var(--field);padding:2px;cursor:pointer}
.looks select{height:34px;font-size:13px}
.ad-list{display:grid;gap:8px;max-height:460px;overflow-y:auto;padding-right:4px}
.ad-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft)}
.ad-row.editing{border-color:var(--mint)}
.ad-row img{width:48px;height:48px;border-radius:11px;object-fit:cover;object-position:50% 12%;border:2px solid var(--rc);background:var(--ink-2)}
.ad-row .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-row .mt{font-size:12px;color:var(--muted);font-weight:700}
.ad-row .acts{display:flex;gap:4px;align-items:center}
.ad-row .acts .iconbtn{width:34px;height:34px;border-radius:10px}
.ad-row .acts .ic{width:17px;height:17px}
.confirm{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800}
.feat{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.ad-data{margin-top:14px;border-top:1px solid var(--edge-soft);padding-top:12px}
.ad-data .row{margin-top:10px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:10px 0 20px}
.islot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 10px;align-items:center;padding:8px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft)}
.islot .iprev{width:44px;height:44px;border-radius:12px;background:var(--field);display:grid;place-items:center;color:var(--text)}
.islot .iprev .ic,.islot .iprev .cic{width:26px;height:26px}
.islot .iname{font-weight:900;font-size:13px;min-width:0}
.islot .iname span{display:block;font-size:11px;color:var(--faint);font-weight:700}
.islot .iname span.cust{color:var(--mint)}
.islot .iprev{grid-row:span 2}
.islot .acts{display:flex;gap:4px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--edge-soft)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;padding:11px 18px;border-radius:16px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:pop .25s ease}

@media (max-width:820px){
  .rail{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px}
  .rail-left{order:1}.stage{order:2;min-height:48vh}.side-right{order:3;align-items:stretch}.dock{order:4}
  .rail-right{display:flex}
  .bmini{width:100%}
  .gbtn{width:66px;height:66px;border-radius:20px;font-size:11px}
  .gbtn .ic{width:23px;height:23px}
  .top-actions{margin-left:0}
  .hud-bottom{grid-template-columns:minmax(0,1fr)}
  .chatlog{max-height:96px;font-size:12px}
  .minimap canvas{width:130px;height:76px}
  .zone-title{top:30%}
  .admin,.detail{grid-template-columns:minmax(0,1fr)}
  .detail-art{max-width:280px}
  .rv-info{left:16px;right:16px;max-width:none;bottom:12%}
  .rv-coin{right:50%;transform:translate(50%,-60%)}
}
@media (max-width:520px){
  .ad-grid{grid-template-columns:minmax(0,1fr)}
  .ad-preview .frame{max-width:200px}
  .sm-hero{grid-template-columns:110px minmax(0,1fr)}
  .sm-hero{grid-template-columns:96px minmax(0,1fr)}
  .summon{height:74px;padding:0 28px}
  .summon .lbl{font-size:26px}
  .dock .gbtn{height:56px;padding:0 14px;font-size:14px}
  .two,.three,.pity{grid-template-columns:minmax(0,1fr)}
  .hbtn span:not(:first-child){display:none}
  .pill .muted{display:none}
  .sum-grid{gap:6px}
  .scard .nm{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .wp-splash,.wp-pearls i,.summon::after,.rtag.r5,.skel div,.modal,.modal-back,.toast,.hint{animation:none!important}
  .menu,.wallpaper,.gbtn,.btn,.card,.iconbtn,.bmini,.wpt{transition:none!important}
}
.std-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.std-strip figure{margin:0;border-radius:14px;overflow:hidden;border:2px solid transparent;background:linear-gradient(180deg,color-mix(in srgb,#a855f7 32%,var(--ink-2)),var(--ink-2)) padding-box,var(--ur) border-box}
.std-strip img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.std-strip figcaption{padding:4px 6px;font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(5,8,20,.55)}
.bstack{display:grid;gap:10px}
.ban-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px 6px 6px;border-radius:12px;background:var(--glass);border:1px solid var(--edge-soft);cursor:pointer}
.ban-row img{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:50% 15%}
.ban-row input{position:absolute;opacity:0;pointer-events:none}
.ban-row i{width:40px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.ban-row i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.ban-row input:checked~i{background:var(--mint)}
.ban-row input:checked~i::after{transform:translateX(16px)}
.ban-row input:focus-visible~i{outline:2px solid var(--mint);outline-offset:2px}
.ban-row .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ban-row .mt{font-size:11px;color:var(--muted);font-weight:700}
/* ---------- Main menu (home screen): HUD pieces float over the wallpaper ---------- */
.menu{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .35s ease,transform .35s ease;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(14px,env(safe-area-inset-left,0px));--sr:max(14px,env(safe-area-inset-right,0px))}
.menu::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transition:opacity .35s;background:linear-gradient(180deg,rgba(8,12,30,.55),transparent 22%,transparent 70%,rgba(8,12,30,.6)),linear-gradient(90deg,rgba(8,12,30,.35),transparent 25%,transparent 75%,rgba(8,12,30,.35))}
.menu.is-open{opacity:1;pointer-events:auto;transform:none}
.hm{position:absolute;transition:opacity .3s ease,transform .3s ease}
.menu.ui-hidden .hm{opacity:0;pointer-events:none}
.menu.ui-hidden .hm-tl,.menu.ui-hidden .hm-tr,.menu.ui-hidden .ticker{transform:translateY(-14px)}
.menu.ui-hidden .hm-tabs,.menu.ui-hidden .hm-br,.menu.ui-hidden .portal{transform:translateY(14px)}
.menu.ui-hidden .hm-left{transform:translateX(-14px)}.menu.ui-hidden .hm-right{transform:translateX(14px)}
.menu.ui-hidden::before{opacity:0}
.menu.ui-hidden{cursor:pointer}
.unhide{position:absolute;right:var(--sr);bottom:calc(14px + var(--sb));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
.menu.ui-hidden .unhide{opacity:.55;pointer-events:auto}
.menu.ui-hidden .unhide:hover{opacity:1}
.ts{text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.45)}
.dot-n{position:absolute;width:10px;height:10px;background:#ff4a3d;transform:rotate(45deg);border:1.5px solid #fff;box-shadow:0 0 8px #ff4a3d;pointer-events:none}

.hm-tl{top:calc(10px + var(--st));left:var(--sl);display:flex;align-items:center;gap:12px}
.lvring{position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-content:center;justify-items:center;background:radial-gradient(circle at 35% 30%,#3d4378,#141a38 70%);border:3px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 18px rgba(255,211,107,.4);font-family:var(--display);font-size:26px;line-height:.9}
.lvring small{font-family:var(--body);font-size:8px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
.hm-id{display:grid;gap:1px;min-width:0}
.hm-name{font-family:var(--display);font-size:21px;line-height:1.1;white-space:nowrap}
.hm-sub{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:21px;line-height:1;color:var(--gold)}
.hm-sub .ic{width:18px;height:18px}
.hm-tools{display:flex;gap:10px;margin-left:10px}
.tool{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:900;color:#fff}
.tool .tc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}
.tool:hover .tc{background:var(--glass-hi);transform:translateY(-1px)}

.hm-tr{top:calc(12px + var(--st));right:var(--sr);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cur{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(8,12,30,.55);border:1px solid var(--edge-soft);min-width:116px}
.cur b{flex:1;text-align:center}
.cur .plus{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass-hi);color:var(--gold)}
.cur .plus .ic{width:14px;height:14px}
.rbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}
.rbtn:hover{background:var(--glass-hi);transform:translateY(-1px)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#3a0710;font-size:11px;font-weight:900;display:grid;place-items:center}

.ticker{top:calc(66px + var(--st));right:0;width:min(470px,42vw);height:34px;display:flex;align-items:center;gap:10px;padding:0 var(--sr) 0 14px;border-radius:999px 0 0 999px;background:linear-gradient(90deg,rgba(8,12,30,.65),rgba(8,12,30,.25));font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-align:left}
.ticker .ic{width:18px;height:18px;flex:none;color:#fff}
.ticker span{overflow:hidden;text-overflow:ellipsis}
.ticker .w{color:#7cff8a}
.ticker .fresh{animation:tickIn .45s ease}
@keyframes tickIn{from{opacity:0;transform:translateY(8px)}}

.hm-left{top:calc(90px + var(--st));left:0;display:grid;gap:14px;justify-items:start}
.promo{position:relative;width:300px;height:108px;overflow:hidden;border-radius:0 18px 18px 0;text-align:left;border:1px solid var(--edge);border-left:0;background:linear-gradient(110deg,#2a1a5e,#6b3fd1 45%,#ff6ec7);box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .2s}
.promo:hover{transform:translateX(3px)}
.promo img.chibi{top:-72%;height:290%;object-position:50% 0}
.promo img{position:absolute;right:-10px;top:0;width:58%;height:100%;object-fit:cover;object-position:50% 10%;-webkit-mask:linear-gradient(90deg,transparent,#000 35%);mask:linear-gradient(90deg,transparent,#000 35%)}
.promo .pt{position:absolute;left:var(--sl);top:12px;display:grid;gap:2px;z-index:1}
.promo .pt .eyebrow{color:#fff}
.promo .pt b{font-family:var(--display);font-weight:400;font-style:italic;font-size:30px;line-height:.95;letter-spacing:.02em;max-width:190px;text-transform:uppercase;background:linear-gradient(180deg,#fff 40%,#d9c7ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(40,10,80,.6))}
.promo .pt time{justify-self:start;margin-top:4px;padding:2px 8px;border-radius:999px;background:rgba(8,12,30,.55);font-size:11px;font-weight:900;color:var(--gold)}
.ev-grid{display:grid;grid-template-columns:repeat(2,78px);gap:8px 6px;padding-left:var(--sl)}
.ev{position:relative;display:grid;justify-items:center;align-content:start;width:78px;font-size:11.5px;font-weight:900;line-height:1.15;text-align:center;color:#fff}
.ev .evo{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--ec) 55%,#fff),var(--ec) 52%,color-mix(in srgb,var(--ec) 45%,#000));
  border:2px solid rgba(255,255,255,.8);box-shadow:0 0 0 2px color-mix(in srgb,var(--ec) 60%,transparent),0 6px 16px rgba(0,0,0,.35),inset 0 3px 8px rgba(255,255,255,.45);transition:transform .2s}
.ev:hover .evo{transform:translateY(-2px) scale(1.04)}
.ev .evo .ic{width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.ev .evo{position:relative}
.ev .evo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scale(1.6);transform-origin:50% 56%}
.ev .evo img.art{transform:none;object-position:50% 12%}
.ev .el{margin-top:-9px;position:relative}
.ev time{font-family:var(--display);font-weight:400;font-size:13px;color:var(--gold);letter-spacing:.02em}
.ev .dot-n{top:2px;right:8px}
.hm-right{top:calc(112px + var(--st));right:var(--sr);display:grid;grid-template-columns:repeat(2,78px);gap:8px 6px}

.portal{left:calc(var(--sl) - 4px);bottom:calc(10px + var(--sb));width:124px;height:124px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.portal:hover{transform:scale(1.04)}
.portal .swirl{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,#ffffff 0 8%,#b7f4ff 22%,#4fb0ff 48%,#2a3fd1 70%,#151a5e);box-shadow:0 0 30px rgba(80,180,255,.65),inset 0 0 18px rgba(255,255,255,.5);overflow:hidden}
.portal .swirl::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55),transparent 30%,rgba(126,243,212,.5),transparent 60%,rgba(255,255,255,.45),transparent 85%);animation:spin 6s linear infinite}
.portal .rim{position:absolute;inset:0;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 16px rgba(255,211,107,.5)}
.portal .rim::before{content:"✦";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:22px;text-shadow:0 0 10px var(--gold)}
.portal .plbl{position:relative;font-family:var(--display);font-size:22px;line-height:.95;text-align:center;color:#fff}

.hm-tabs{left:calc(var(--sl) + 128px);bottom:calc(16px + var(--sb));display:flex;align-items:center;padding:6px 18px 6px 10px;border-radius:12px;background:linear-gradient(90deg,rgba(8,12,30,.72),rgba(8,12,30,.2))}
.tabb{position:relative;padding:4px 14px;font-family:var(--display);font-size:21px;letter-spacing:.02em;color:#fff;transition:color .2s}
.tabb:hover{color:var(--gold)}
.tabb+.tabb::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:rgba(255,255,255,.35)}
.tabb .dot-n{top:-6px;right:4px}

.hm-br{right:var(--sr);bottom:calc(14px + var(--sb));display:grid;justify-items:end;gap:8px}
.pitycard{display:grid;gap:5px;width:250px;padding:9px 14px;border-radius:14px;background:rgba(8,12,30,.6);border:1px solid var(--edge-soft);font-size:12px;font-weight:900;text-align:left}
.pitycard .row{justify-content:space-between}
.pitycard .bar{height:6px}
.summon2{position:relative;display:flex;align-items:center;gap:12px;height:72px;padding:0 30px 0 12px;border-radius:999px;color:var(--gold-ink);
  background:linear-gradient(180deg,#fff0b8,#ffcb52 50%,#f59a2c);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(160,80,0,.25),0 12px 36px rgba(255,186,64,.45);transition:transform .2s;overflow:hidden}
.summon2:hover{transform:translateY(-2px) scale(1.02)}
.summon2::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 3.6s ease-in-out infinite}
.summon2 .so{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#ffd36b 45%,#e08a1c);box-shadow:inset 0 2px 4px rgba(255,255,255,.8),0 2px 8px rgba(160,80,0,.35)}
.summon2 .so .ic{width:28px;height:28px}
.summon2 .st{display:grid;text-align:left}
.summon2 .st b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1}
.summon2 .st small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:900;opacity:.8}
.summon2 .st small .cic{width:14px;height:14px}
.summon2 .dot-n{top:10px;right:18px}
.lim-time{display:flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:rgba(8,12,30,.6);font-size:12px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.lim-time .ic{width:14px;height:14px}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}

/* ---------- Character screen ---------- */
.cs{position:fixed;inset:0;z-index:40;overflow:hidden;background:#0b0f24;animation:fade .25s;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(12px,env(safe-area-inset-left,0px));--sr:max(18px,env(safe-area-inset-right,0px))}
.cs-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 46% 55%,color-mix(in srgb,var(--rc) 50%,transparent),transparent 58%),
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.7) 1px,transparent 1.5px) 0 0/130px 130px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.45) 1px,transparent 1.5px) 0 0/90px 90px,
  linear-gradient(160deg,#1c1338,#0a0d22 60%,#1a0c1f)}
.cs-rays{position:absolute;left:46%;top:52%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 5deg,transparent 5deg 16deg);animation:spin 60s linear infinite}
.cs.r5 .cs-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(168,85,247,.22) 44%,rgba(255,110,199,.22) 48%,rgba(62,230,208,.2) 52%,transparent 58%)}
.cs-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%;animation:rvZoom .6s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 40px color-mix(in srgb,var(--rc) 40%,transparent))}
.cs-blur{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) saturate(130%) brightness(.55)}
.cs-art.chibi{inset:auto;left:46%;bottom:2%;width:auto;height:86%;aspect-ratio:9/16;transform:translateX(-50%)}
.cs-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,8,20,.55),transparent 28%,transparent 60%,rgba(6,8,20,.7) 80%)}
.cs-ui{transition:opacity .3s,transform .3s}
.cs.viewing .cs-ui{opacity:0;pointer-events:none}
.cs.viewing .cs-shade{opacity:0}
.cs.viewing{cursor:pointer}
.cs-top{position:absolute;top:calc(10px + var(--st));left:var(--sl);display:flex;gap:10px;z-index:3}
.cs-back{height:42px;padding:0 22px 0 12px;border-radius:10px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#e2e7f6);color:#141a38;font-family:var(--display);font-size:21px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cs-back .ic{width:20px;height:20px}
.cs-help{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#141a38;font-family:var(--display);font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cs-list{position:absolute;left:var(--sl);top:calc(66px + var(--st));bottom:calc(12px + var(--sb));width:98px;border-radius:49px;padding:12px 0;z-index:3;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(8,12,30,.55);border:1px solid var(--edge-soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cs-list::-webkit-scrollbar{display:none}
.cs-av{position:relative;flex:none;display:grid;justify-items:center;gap:3px}
.cs-av .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:var(--rc);transition:box-shadow .2s,transform .2s}
.cs-av.r5 .ring{background:var(--ur)}
.cs-av:hover .ring{transform:scale(1.05)}
.cs-av .ring span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--ink-2)}
.cs-av img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.cs-av img.chibi{object-position:50% 50%;transform:scale(1.6);transform-origin:50% 56%}
.cs-av.on .ring{box-shadow:0 0 0 3px #e8ff7a,0 0 20px #c8ff5a}
.cs-av.locked img{filter:grayscale(1) brightness(.5)}
.cs-av .cnt{position:absolute;top:-2px;right:-6px;min-width:22px;padding:1px 5px;border-radius:999px;background:rgba(8,12,30,.85);font-size:10px;font-weight:900;color:var(--gold);border:1px solid var(--edge-soft)}
.cs-av .stars6{font-size:9px}
.cs-av .lockic{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:#fff;opacity:.85}
.cs-av .lockic .ic{width:20px;height:20px}
.cs-tabs{position:absolute;left:calc(var(--sl) + 124px);top:calc(120px + var(--st));display:grid;gap:18px;z-index:3}
.cs-tab{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:25px;letter-spacing:.02em;color:rgba(255,255,255,.88);text-align:left}
.cs-tab .ti{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);transition:background .2s,box-shadow .2s}
.cs-tab:hover .ti{background:rgba(255,255,255,.22)}
.cs-tab.on{color:#e8ff7a}
.cs-tab.on .ti{background:radial-gradient(circle at 40% 35%,#f4ffb0,#a8e04a);color:#22300a;border-color:transparent;box-shadow:0 0 18px rgba(200,255,90,.7)}
.cs-tab .soon{font-family:var(--body);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--muted)}
.cs-side{position:absolute;right:calc(var(--sr) + min(440px,36vw) + 22px);bottom:calc(90px + var(--sb));display:grid;gap:14px;z-index:3}
.cs-side .rbtn{width:52px;height:52px;background:rgba(255,255,255,.9);color:#141a38;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cs-side .rbtn .ic{width:24px;height:24px}
.cs-side .rbtn.on{background:#e8ff7a}
.cs-skins{position:absolute;right:calc(var(--sr) + min(440px,36vw) + 86px);bottom:calc(90px + var(--sb));z-index:4;display:grid;gap:8px;padding:12px;border-radius:18px;width:min(300px,60vw)}
.cs-skins .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cs-skins button.sk{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--rc);background:var(--ink-2);text-align:left}
.cs-skins button.sk.on{box-shadow:0 0 0 2px #e8ff7a}
.cs-skins button.sk img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.cs-skins button.sk.locked img{filter:grayscale(.85) brightness(.55)}
.cs-skins button.sk span{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 4px;font-size:10px;font-weight:900;background:linear-gradient(transparent,rgba(5,8,20,.9));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-panel{position:absolute;right:var(--sr);top:calc(36px + var(--st));bottom:calc(16px + var(--sb));width:min(440px,36vw);z-index:3;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.cs-head{position:relative;display:grid;gap:0;padding-right:110px}
.cs-elem{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--gold)}
.cs-name{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,50px);line-height:1;letter-spacing:.01em}
.cs-badge{position:absolute;right:4px;top:4px;padding:2px 18px;transform:skewX(-14deg) rotate(-4deg);font-family:var(--display);font-style:italic;font-size:42px;line-height:1.05;border-radius:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.cs-badge.r5{background:linear-gradient(90deg,#a855f7,#ff6ec7,#3ee6d0,#a855f7);background-size:200% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 22px rgba(255,110,199,.55)}
.cs-badge.r4{background:linear-gradient(180deg,#ffd6a6,#ff7a2a);color:#4a1d00;text-shadow:none;box-shadow:0 0 22px rgba(255,160,80,.6)}
.cs-sep{position:relative;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.08));margin:2px 0}
.cs-sep::before,.cs-sep::after{content:"";position:absolute;top:-2.5px;width:6px;height:6px;transform:rotate(45deg);background:rgba(255,255,255,.7)}
.cs-sep::before{left:-3px}.cs-sep::after{right:0;background:rgba(255,255,255,.35)}
.cs-traits{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cs-traits .stars6{font-size:26px;gap:2px}
.trait{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;line-height:1.1}
.trait i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--el,#fff) 30%,rgba(8,12,30,.6));border:1px solid color-mix(in srgb,var(--el,#fff) 70%,transparent)}
.trait i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--el,#fff);box-shadow:0 0 8px var(--el,#fff)}
.trait i.ic-t::after{display:none}
.trait i .ic{width:16px;height:16px}
.cs-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cs-box{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
.cs-box .lbl-sm{display:block}
.cs-box b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.cs-box b em{font-style:normal;color:#e8ff7a}
.cs-card{padding:14px 16px;border-radius:14px;background:rgba(8,12,30,.55);border:1px solid var(--edge-soft)}
.cs-card p{margin:0;color:var(--muted);font-size:14px}
.cs-pill{height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.cs-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cs-actions .btn{width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted);font-weight:800}
.kv dd{margin:0;font-weight:900;text-align:right}
.bond-heart{display:flex;align-items:center;gap:14px}
.bond-heart .hrt{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0e2,#ff6f91 55%,#b8325a);box-shadow:0 0 22px rgba(255,111,145,.5);font-family:var(--display);font-size:26px;color:#fff}
.bond-track{display:grid;gap:8px}
.bond-node{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:800}
.bond-node b{font-family:var(--display);font-weight:400;font-size:16px;color:#ff9ec4}
.bond-node .ic{width:16px;height:16px;color:var(--faint)}
@media (max-width:820px){
  .hm-tl{gap:8px}
  .lvring{width:50px;height:50px;font-size:20px}
  .hm-name,.hm-sub{font-size:16px}
  .hm-tools{margin-left:2px;gap:4px}
  .tool .tc{width:38px;height:38px}
  .tool{font-size:10px}
  .hm-tr{top:calc(76px + var(--st));left:var(--sl);justify-content:flex-start}
  .cur{min-width:0}
  .ticker{display:none}
  .hm-left{top:calc(176px + var(--st));gap:10px}
  .promo{width:210px;height:84px}
  .promo .pt b{font-size:21px;max-width:130px}
  .ev-grid,.hm-right{grid-template-columns:repeat(2,64px);gap:6px 4px}
  .hm-right{top:calc(176px + var(--st))}
  .ev{width:64px;font-size:10px}
  .ev .evo{width:50px;height:50px}
  .ev .evo .ic{width:24px;height:24px}
  .portal{width:92px;height:92px;bottom:calc(64px + var(--sb))}
  .portal .plbl{font-size:17px}
  .hm-tabs{left:var(--sl);right:var(--sr);bottom:calc(10px + var(--sb));justify-content:center;padding:4px}
  .tabb{font-size:16px;padding:4px 10px}
  .hm-br{bottom:calc(64px + var(--sb))}
  .pitycard{display:none}
  .summon2{height:60px;padding:0 20px 0 8px}
  .summon2 .so{width:42px;height:42px}
  .summon2 .st b{font-size:25px}
  .cs-list{top:calc(62px + var(--st));bottom:auto;left:var(--sl);right:var(--sl);width:auto;height:104px;border-radius:24px;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 12px}
  .cs-av .ring{width:56px;height:56px}
  .cs-tabs{top:calc(176px + var(--st));left:var(--sl);gap:10px}
  .cs-tab{font-size:17px;gap:8px}
  .cs-tab .ti{width:34px;height:34px}
  .cs-tab .soon{display:none}
  .cs-art{object-position:50% 0}
  .cs-art.chibi{left:62%;height:52%;bottom:auto;top:calc(150px + var(--st))}
  .cs-panel{top:auto;left:var(--sl);right:var(--sl);width:auto;max-height:44%;padding:14px;border-radius:20px;background:rgba(8,12,30,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .cs-name{font-size:32px}
  .cs-badge{font-size:28px}
  .cs-side{right:var(--sr);bottom:auto;top:calc(176px + var(--st))}
  .cs-side .rbtn{width:44px;height:44px}

}
/* ---------- Summon screen (full screen) ---------- */
.sx{position:fixed;inset:0;z-index:45;overflow:hidden;animation:fade .25s;color:#fff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:max(16px,env(safe-area-inset-left,0px));--sr:max(18px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 58% 70%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 60%),
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.75) 1px,transparent 1.5px) 0 0/140px 140px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.45) 1px,transparent 1.5px) 0 0/95px 95px,
  linear-gradient(180deg,#0d1230,#151b45 55%,#2a2f6a 82%,#c9d4f5)}
.sx-word{position:absolute;left:12%;top:2%;font-family:var(--display);font-size:clamp(90px,16vw,240px);line-height:1;color:rgba(255,255,255,.04);white-space:nowrap;pointer-events:none}
.sx-line{position:absolute;z-index:1;left:14%;right:16%;top:4%;bottom:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sx-fig{position:relative;flex:none;height:92%;aspect-ratio:9/16;margin:0 -5.5%;animation:sxIn .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * .08s)}
.sx-fig.main{height:100%;z-index:2}
.sx-fig.chibi{height:58%;margin:0 -4%;bottom:6%}
.sx-fig.chibi.main{height:70%}
.sx-fig img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;filter:drop-shadow(0 0 30px rgba(0,0,0,.35))}
.sx-fig.art img{object-fit:cover;object-position:50% 15%;-webkit-mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
@keyframes sxIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
.sx-fade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;background:linear-gradient(transparent,rgba(13,18,48,.55) 50%,rgba(13,18,48,.85))}
.sx-top{position:absolute;top:calc(14px + var(--st));left:var(--sl);display:flex;gap:12px;z-index:3}
.sx-cur{position:absolute;top:calc(14px + var(--st));right:var(--sr);display:flex;gap:10px;z-index:3}
.sx-cur .cur{min-width:150px;background:rgba(8,12,30,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sx-tabs{position:absolute;left:var(--sl);top:calc(84px + var(--st));display:grid;gap:16px;z-index:3}
.sx-tab{position:relative;width:250px;height:92px;border-radius:8px;overflow:hidden;text-align:left;border:3px solid rgba(255,255,255,.25);background:linear-gradient(110deg,#2a3aa0,#5a7ae0);box-shadow:0 8px 22px rgba(0,0,0,.35);transition:transform .2s,border-color .2s}
.sx-tab:hover{transform:translateX(3px)}
.sx-tab.on{border-color:#ffd84a;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 22px rgba(255,216,74,.55)}
.sx-tab.lim{background:linear-gradient(110deg,#3a1a7e,#8a4ae0 55%,#ff6ec7)}
.sx-tab img{position:absolute;right:0;top:0;width:55%;height:100%;object-fit:cover;object-position:50% 10%;-webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%)}
.sx-tab img.chibi{top:-75%;height:300%;object-position:50% 0}
.sx-tab b{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-weight:400;font-style:italic;font-size:24px;line-height:.9;text-transform:uppercase;letter-spacing:.02em;color:#fff;
  text-shadow:0 2px 0 rgba(20,10,60,.7),0 0 12px rgba(120,160,255,.6);max-width:150px}
.sx-tab small{position:absolute;left:14px;top:8px;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.sx-tab .dot-n{top:6px;right:8px}
.sx-title{position:absolute;right:var(--sr);top:22%;z-index:2;display:grid;justify-items:end;gap:6px;text-align:right;max-width:min(640px,60vw)}
.sx-title h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,5.6vw,80px);line-height:1;letter-spacing:.01em;text-shadow:0 3px 0 rgba(10,15,40,.6),0 0 30px rgba(10,15,40,.6)}

.sx-title .chip{font-size:13px}

.sx-bl{position:absolute;left:var(--sl);bottom:calc(14px + var(--sb));display:flex;gap:18px;z-index:3}

.sx-rb .c{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(160,175,220,.25));border:2px solid rgba(255,255,255,.6);box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .2s}
.sx-rb:hover .c{transform:translateY(-2px)}

.sx-skip{position:absolute;left:50%;bottom:calc(44px + var(--sb));transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;cursor:pointer;z-index:3}

.sx-pull .dot-n{top:8px;right:22px}
.sx-note{position:absolute;right:var(--sr);bottom:calc(4px + var(--sb));font-size:11px;font-weight:800;color:rgba(255,255,255,.7);z-index:3}
